<!doctype html>
<html lang="de" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContentPilot – Architektur-Karte</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface2:#eef0f4; --text:#1b2330; --muted:#5b6678; --border:#d5dae3;
  --canvas:#fbfbfd; --edge:#6b7587; --edge-hl:#1d4ed8; --accent:#2563eb; --warn-bg:#fff4d6; --warn-bd:#e0a800; --warn-tx:#5c4300;
  --shadow:0 4px 18px rgba(20,30,50,.18);--ntext:#0b1220;--elabel:#374151;--elabel-on:#0b1220;
  --ui-f:#dbeafe; --ui-b:#2563eb;
  --server-f:#ede9fe; --server-b:#7c3aed;
  --shopify-f:#dcfce7; --shopify-b:#16a34a;
  --db-f:#fef3c7; --db-b:#d97706;
  --ai-f:#fce7f3; --ai-b:#db2777;
  --job-f:#e2e8f0; --job-b:#475569;
  --storefront-f:#cffafe; --storefront-b:#0891b2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#171d27; --surface2:#1f2733; --text:#e8edf5; --muted:#9aa6b8; --border:#323c4d;
    --canvas:#111720; --edge:#a9b6ca; --edge-hl:#7db4ff; --accent:#6aa5ff; --warn-bg:#3a2f0b; --warn-bd:#c79a14; --warn-tx:#f6e3a6;
    --shadow:0 4px 18px rgba(0,0,0,.5);--ntext:#f8fafc;--elabel:#d3dae4;--elabel-on:#ffffff;
    --ui-f:#1c3558; --ui-b:#5aa2ff;
    --server-f:#33285e; --server-b:#a78bfa;
    --shopify-f:#14452a; --shopify-b:#4ade80;
    --db-f:#573a0b; --db-b:#fbbf24;
    --ai-f:#561a39; --ai-b:#f472b6;
    --job-f:#2d3748; --job-b:#a0aec0;
    --storefront-f:#124456; --storefront-b:#22d3ee;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171d27; --surface2:#1f2733; --text:#e8edf5; --muted:#9aa6b8; --border:#323c4d;
  --canvas:#111720; --edge:#a9b6ca; --edge-hl:#7db4ff; --accent:#6aa5ff; --warn-bg:#3a2f0b; --warn-bd:#c79a14; --warn-tx:#f6e3a6;
  --shadow:0 4px 18px rgba(0,0,0,.5);--ntext:#f8fafc;--elabel:#d3dae4;--elabel-on:#ffffff;
  --ui-f:#1c3558; --ui-b:#5aa2ff;
  --server-f:#33285e; --server-b:#a78bfa;
  --shopify-f:#14452a; --shopify-b:#4ade80;
  --db-f:#573a0b; --db-b:#fbbf24;
  --ai-f:#561a39; --ai-b:#f472b6;
  --job-f:#2d3748; --job-b:#a0aec0;
  --storefront-f:#124456; --storefront-b:#22d3ee;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;min-height:56px}
header .ttl{min-width:0}
header h1{font-size:17px;margin:0;line-height:1.2}
header .sub{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text)}
.sw{width:14px;height:14px;border-radius:4px;border:2px solid;display:inline-block;flex:none}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:4px 10px;cursor:pointer;font-size:12px}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.k-ui{--f:var(--ui-f);--b:var(--ui-b)}.k-server{--f:var(--server-f);--b:var(--server-b)}.k-shopify{--f:var(--shopify-f);--b:var(--shopify-b)}
.k-db{--f:var(--db-f);--b:var(--db-b)}.k-ai{--f:var(--ai-f);--b:var(--ai-b)}.k-job{--f:var(--job-f);--b:var(--job-b)}.k-storefront{--f:var(--storefront-f);--b:var(--storefront-b)}
.sw{background:var(--f);border-color:var(--b)}
#body{flex:1;display:flex;min-height:0;position:relative}
#side{width:230px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
#search{margin:10px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:13px}
#search:focus{outline:2px solid var(--accent);outline-offset:0}
#plist{overflow:auto;padding:0 6px 10px;flex:1}
.pitem{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;cursor:pointer;align-items:flex-start;font-size:13px}
.pitem:hover{background:var(--surface2)}
.pitem[aria-current="true"]{background:var(--accent);color:#fff}
.pitem .num{flex:none;min-width:22px;font-weight:700;opacity:.8}
.pitem .sn{display:block;font-size:11px;opacity:.75}
.shead{font-size:11px;color:var(--muted);padding:4px 8px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#intro{padding:10px 18px 8px;background:var(--surface);border-bottom:1px solid var(--border)}
#intro h2{margin:0 0 2px;font-size:16px}
#intro.col p{display:none}
#introrow{display:flex;align-items:center;gap:10px}
#introrow button{margin-left:auto;background:none;border:1px solid var(--border);border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer;color:var(--muted)}
#intro p{margin:0;color:var(--muted);font-size:13px;max-width:110ch}
#canvas{flex:1;position:relative;min-height:0;background:var(--canvas);overflow:hidden}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#svg.panning{cursor:grabbing}
#ctl{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:3}
#ctl button{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 11px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12);font-size:13px}
#ctl button:hover{background:var(--surface2)}
#panel{position:absolute;right:0;top:0;bottom:0;z-index:5;width:min(380px,92%);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
#panel.closed{display:none}
#phead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
#phead button{background:none;border:0;font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
#phead button:hover{background:var(--surface2)}
#pbody{overflow:auto;padding:14px;flex:1}
#pbody h3{margin:8px 0 4px;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
#pbody h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 6px;border-radius:999px;background:var(--f);border:1.5px solid var(--b);font-size:12px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--b);display:inline-block}
.warn{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx);border-radius:8px;padding:8px 10px;margin:10px 0;font-size:13px}
.rule{border-left:3px solid var(--accent);background:var(--surface2);padding:8px 10px;border-radius:0 8px 8px 0;font-size:13px}
.mono{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.frow{display:flex;gap:6px;align-items:flex-start;margin:3px 0}
.frow code,.fn{overflow-wrap:anywhere;flex:1;background:var(--surface2);border-radius:6px;padding:3px 6px}
.fn{display:block;margin:3px 0}
.cp{flex:none;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:11px;padding:2px 7px;cursor:pointer}
.cp:hover{background:var(--surface2)}
.conn{display:flex;gap:8px;width:100%;text-align:left;background:var(--surface2);border:1px solid transparent;border-radius:8px;padding:6px 8px;margin:3px 0;cursor:pointer;font-size:13px;align-items:baseline}
.conn:hover{border-color:var(--accent)}
.conn .arr{flex:none;font-weight:700;color:var(--accent)}
.conn small{display:block;color:var(--muted);font-size:11px}
.hint{color:var(--muted);padding:6px 2px}
.hint p{margin:0 0 10px}
.dashnote{font-size:11px;color:var(--muted)}
/* svg */
.node{cursor:pointer;outline:none}
.node .box{fill:var(--f);stroke:var(--b);stroke-width:1.8}
.node .stripe{fill:none;stroke:var(--b);stroke-width:4;stroke-linecap:round}
.node text{fill:var(--ntext);pointer-events:none}
.node:hover .box,.node.act .box{stroke-width:3}
.node.sel .box{stroke-width:3.5}
.node.sel .glow{stroke:var(--accent);opacity:.55}
.glow{fill:none;stroke:none;stroke-width:3;pointer-events:none}
.node:focus-visible .glow{stroke:var(--accent);stroke-width:3;opacity:1}
.node.dim{opacity:.85}
.badge circle{fill:#f5b301;stroke:#7a5a00;stroke-width:1}
.badge text{fill:#2b2000!important;font-weight:700;font-size:11px}
.edge path{fill:none;stroke:var(--edge);stroke-width:1.8;stroke-linecap:round}
.edge.dashed path{stroke-dasharray:6 4}
.edge.on path{stroke:var(--edge-hl);stroke-width:2.6}
.edge.dim{opacity:.55}
.elabel{pointer-events:none}
.elabel rect{fill:var(--canvas);stroke:var(--border);stroke-width:.8}
.elabel text{fill:var(--elabel);font-size:12px}
.elabel.on rect{stroke:var(--edge-hl)}
.elabel.on text{fill:var(--elabel-on)}
.elabel.dim{opacity:.65}
#meas{visibility:hidden}
.mk{fill:context-stroke}

@media (max-width:760px){
  #side{width:170px}
  .legend{margin-left:0}
}
</style>
</head>
<body>
<header>
  <div class="ttl"><h1>ContentPilot – Architektur-Karte</h1><div class="sub">Zehn Abläufe der App als anklickbare Diagramme – Knoten anklicken für Dateien, Funktionen und Regeln.</div></div>
  <div class="legend" id="legend"></div>
  <div class="seg" id="themeseg" role="group" aria-label="Farbschema">
    <button data-t="auto" aria-pressed="true">Auto</button><button data-t="light" aria-pressed="false">Hell</button><button data-t="dark" aria-pressed="false">Dunkel</button>
  </div>
</header>
<div id="body">
  <nav id="side" aria-label="Pipelines">
    <input id="search" type="search" placeholder="Suchen (Knoten, Datei, Funktion)" aria-label="Suchen">
    <div id="plist"></div>
  </nav>
  <main id="main">
    <div id="intro"><div id="introrow"><h2 id="ptitle"></h2><button id="itoggle" type="button">Einleitung ausblenden</button></div><p id="pintro"></p></div>
    <div id="canvas">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Diagramm">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path class="mk" d="M0,1 L10,5 L0,9 z"/></marker>
        </defs>
        <text id="meas" x="0" y="0" font-size="11">x</text>
        <g id="world"></g>
      </svg>
      <aside id="panel" class="closed" aria-label="Details"><div id="phead"><span>Details</span><button id="pclose" aria-label="Schließen" title="Schließen (Esc)">×</button></div><div id="pbody"></div></aside>
      <div id="ctl"><button id="zin" title="Vergrößern" aria-label="Vergrößern">+</button><button id="zout" title="Verkleinern" aria-label="Verkleinern">−</button><button id="zfit">Einpassen</button></div>
    </div>
  </main>
</div>
<script>
(function(){
"use strict";
var DATA = [{"id":"p1","title":"Gesamtübersicht","intro":"So hängt die App zusammen: Der Händler arbeitet im Shopify-Admin, wo ContentPilot als eingebettete App (iframe, App Bridge) läuft. Seiten und API-Routen rufen Actions und Services auf der Server-Seite auf. Diese sprechen mit Shopify (GraphQL), der eigenen Datenbank (PostgreSQL via Prisma) und den KI-Anbietern. Daneben laufen Webhooks von Shopify, Hintergrund-Jobs und die Theme-Erweiterung im Online-Shop.","nodes":[{"id":"admin","label":"Shopify-Admin\n(App Bridge, iframe)","kind":"server","col":0,"row":1,"desc":"Der Händler öffnet die App im Shopify-Admin. Sie läuft als eingebettete App im iframe und meldet sich per App Bridge (Session-Token) an. Alle Seiten werden zuerst auf dem Server gerendert; danach übernimmt der Browser die fertige Seite und macht sie bedienbar (Hydration).","files":["app/root.tsx","app/routes/app.tsx","app/entry.server.tsx"],"functions":["handleError"],"rule":"Alle /app/*-Routen werden auf dem Server gerendert; Server und Browser müssen denselben Baum liefern (Hydration), sonst wirft React die Seite weg.","unsure":false,"unsureNote":""},{"id":"shopify_wh","label":"Shopify\n(Webhook-Versand)","kind":"shopify","col":0,"row":3,"desc":"Shopify meldet Ereignisse selbst an die App: Produkte und Kollektionen (create/update/delete), App-Deinstallation, Abo-Änderungen und die Pflicht-Datenschutz-Meldungen. Für Seiten, Artikel, Blogs und Richtlinien gibt es keinen Webhook.","files":["shopify.app.prod.toml"],"functions":[],"rule":"Pages, Articles, Blogs und Policies haben keinen Webhook - dafür gibt es die nächtliche Drift-Suche als Ersatz.","unsure":false,"unsureNote":""},{"id":"storefront","label":"Online-Shop\n(Theme-Erweiterung)","kind":"storefront","col":0,"row":4,"desc":"Im Theme des Händlers läuft die eine Theme-App-Extension mit allen Blöcken (JSON-LD, Social-Meta, Web-Vitals, Direktübersetzung, Varianten-Galerie, Sprachumschalter, Bilder pro Sprache) und Snippets. Sie liest Daten aus dem Theme und meldet Messwerte und Besuche über den App-Proxy zurück.","files":["extensions/storefront/shopify.extension.toml","extensions/storefront/blocks/web-vitals.liquid","extensions/storefront/assets/web-vitals.js"],"functions":[],"rule":"Es darf nur EINE Theme-Extension pro App geben, alles liegt unter extensions/storefront/. Liquid-Blöcke UND Snippets zählen zusammen zum 100-KiB-Limit; Logik gehört nach assets/. Deshalb wird mit npm run deploy minifiziert.","unsure":false,"unsureNote":""},{"id":"shell","label":"App-Shell\napp.tsx (Loader)","kind":"server","col":1,"row":0,"desc":"Die Hülle um alle /app-Seiten. Ihr Loader meldet den Händler an (authenticate.admin), gleicht das Abo ab und lädt Grunddaten wie Sprache und Plan. Die Anmeldung in shopify.server.ts vermerkt zugleich die Aktivität und startet den Hintergrund-Sync des Shops. Eine von Shopify geworfene Antwort (Weiterleitung, App-Bridge-Handshake) wird bewusst nicht abgefangen.","files":["app/routes/app.tsx","app/shopify.server.ts"],"functions":["loader","authenticate"],"rule":"authenticate.admin steht außerhalb des try: eine geworfene Response ist Kontrollfluss (OAuth, Session-Token-Retry) und darf nie in eine normale Seite verwandelt werden.","unsure":false,"unsureNote":""},{"id":"pages","label":"Seiten\napp.*.tsx","kind":"server","col":1,"row":1,"desc":"Je Bereich eine Route: Produkte, Kollektionen, Seiten, Blog, Policies, Bulk-Editor, Theme-Inhalte, Einstellungen usw. Jede hat einen Loader (Daten) und meist eine Action (Speichern), die an gemeinsame Handler weitergereicht wird. SEO und Aufgaben haben eigene Actions.","files":["app/routes/app.products.tsx","app/routes/app.pages.tsx","app/routes/app.bulk.tsx","app/utils/content-route-action.server.ts"],"functions":["makeContentRouteAction","makeThemeContentRouteAction"],"rule":"Inhalts-Seiten bauen ihre Action mit makeContentRouteAction bzw. (Theme-Seiten, Cookie-Banner) makeThemeContentRouteAction; beide prüfen den Plan auf dem Server (planGateRefusal). Neue Routen nur, wenn keine bestehende erweitert werden kann.","unsure":false,"unsureNote":""},{"id":"api","label":"Resource-Routen\napi.*.tsx","kind":"server","col":1,"row":2,"desc":"Routen ohne eigene Seite, die per fetch aufgerufen werden: KI-Aufrufe (api.ai), Sync-Auslöser, Task-Status, Speichern aus dem Editor (api.content-editor-action), Produktbilder, Bestand, Abrechnung und diverse Mess-Probes. Sie sind direkt per POST erreichbar und prüfen deshalb Plan und Rechte selbst.","files":["app/routes/api.ai.tsx","app/routes/api.content-editor-action.tsx","app/routes/api.sync-trigger.tsx","app/routes/api.task-status.tsx"],"functions":["action"],"rule":"Direkt erreichbare Routen (api.*, CSV-Export) prüfen Plan und Berechtigung in der Route selbst, nie nur in der Oberfläche.","unsure":false,"unsureNote":""},{"id":"webhooks","label":"Webhook-Routen\nwebhooks.*.tsx","kind":"server","col":1,"row":3,"desc":"Empfangen die Shopify-Ereignisse, prüfen die Signatur und starten den passenden Abgleich (z. B. Produkt neu einlesen). Schlagen Produkt- oder Kollektions-Webhooks fehl, wird der Auftrag für einen späteren Wiederholversuch vorgemerkt.","files":["app/routes/webhooks.products.tsx","app/routes/webhooks.collections.tsx","app/routes/webhooks.app-uninstalled.tsx","app/routes/webhooks.compliance.tsx","app/routes/webhooks.subscription.tsx"],"functions":["action"],"rule":"server.js registriert den Web-API-Adapter statisch VOR Sentry.init; sonst antwortet jeder Webhook mit 400. Ein Webhook mit falscher Signatur muss 401 liefern, nicht 400.","unsure":false,"unsureNote":""},{"id":"proxy","label":"App-Proxy\nproxy.*.tsx","kind":"server","col":1,"row":4,"desc":"Der Online-Shop erreicht die App über /apps/contentpilot/*, Shopify leitet das an die proxy.*-Routen weiter (Signatur wird geprüft). Darüber laufen Wörterbuch für Direktübersetzungen, Web-Vitals, KI-Besucher-Zählung, 404-Meldungen und die IndexNow-Schlüsseldatei.","files":["app/routes/proxy.web-vitals.tsx","app/routes/proxy.dynamic-translations.tsx","app/routes/proxy.ai-referral.tsx","app/routes/proxy.indexnow-key.tsx"],"functions":["action","loader"],"rule":"Die Routen sind öffentlich erreichbar: Der KI-Referral-Endpunkt speichert nur einen Quellen-Schlüssel, nie den Referrer, Cookies oder IP.","unsure":false,"unsureNote":""},{"id":"actions","label":"Actions\napp/actions","kind":"server","col":2,"row":1,"desc":"Die eigentliche Speicher- und Übersetzungslogik für Inhalte. Alles läuft über handleUnifiedContentActions, das je nach Aktion (updateContent, translateAll, createContent, deleteContent ...) die passende Funktion aufruft. Produkte haben zusätzlich einen eigenen Update-Pfad.","files":["app/actions/unified-content.actions.ts","app/actions/content/content-update.action.ts","app/actions/product/update.actions.ts"],"functions":["handleUnifiedContentActions","handleUpdateContent"],"rule":"Produkte, Kollektionen, Seiten, Blogs und Artikel gehen alle durch handleUnifiedContentActions - keine parallelen Handler hinzufügen.","unsure":false,"unsureNote":""},{"id":"services","label":"Services\napp/services","kind":"server","col":2,"row":2,"desc":"Die Fachlogik: Synchronisation mit Shopify, Übersetzungs-Prüfungen, SEO (Audit, Crawl, Sitemap, IndexNow), Bulk-Editor, Menüs, Metaobjekte, Abrechnung, KI-Zugangsdaten. Services lesen und schreiben die Datenbank und rufen Shopify über das Gateway.","files":["app/services/product-sync.service.ts","app/services/content-sync.service.ts","app/services/bulk-editor/apply.server.ts","app/services/billing.server.ts"],"functions":["applyBulkDiff","syncProduct"],"rule":"Ein Reload einzelner Elemente kennt nur bereits bekannte IDs; neue Shopify-Objekte erscheinen erst durch einen vollen syncAll*-Lauf.","unsure":false,"unsureNote":""},{"id":"ticks","label":"Hintergrund-Ticks\n(in der App)","kind":"job","col":2,"row":3,"desc":"Zeitgesteuerte Dienste im App-Prozess: der Sync-Scheduler (alle ca. 60 s, solange ein Shop aktiv ist), der nächtliche Drift-Sweep für Übersetzungen, die SEO-Audit- und Crawl-Auto-Runs, GSC-, llms.txt- und IndexNow-Sweeps, der Shop-Reaper (DSGVO-Löschung) und die Webhook-Wiederholung aus der Datenbank.","files":["app/services/sync-scheduler.service.ts","app/services/translations/translation-drift-auto-run.service.ts","app/services/seo/audit-auto-run.service.ts","app/services/seo/crawl-auto-run.service.ts","app/services/webhook-retry.service.ts","src/services/shop-reaper.service.ts"],"functions":["startSyncForShop","tick","start","processQueue"],"rule":"Die Sweeps (regelmäßige Durchläufe über alle Shops: Reaper, GSC, llms.txt, IndexNow, Audit, Crawl, Drift) starten einmal pro Prozess beim ersten angemeldeten Aufruf (app/shopify.server.ts, idempotent); der Sync-Scheduler pro Shop; die Webhook-Wiederholung startet, sobald eine Webhook-Route sie lädt. Der Drift-Sweep ersetzt den fehlenden Webhook für Seiten/Artikel/Blogs/Policies und läuft täglich.","unsure":false,"unsureNote":""},{"id":"ai","label":"KI-Dienst\n(Queue + Anbieter)","kind":"ai","col":3,"row":1,"desc":"Alle KI-Aufrufe laufen über AIService und eine Warteschlange mit Ratenbegrenzung. Unterstützt werden Anthropic, Gemini, OpenAI, HuggingFace, DeepSeek und Grok. Wessen Schlüssel verwendet wird (eigener oder Betreiber-Schlüssel), entscheidet genau ein Modul.","files":["src/services/ai.service.ts","src/services/ai-queue.service.ts","app/services/ai/ai-credentials.server.ts"],"functions":["AIService","AIQueueService","aiCredentialsFor"],"rule":"Nur ai-credentials.server.ts liest MANAGED_AI_*-Variablen; eine Ablehnung ist ein typisierter Fehler (ManagedAiRefusedError) und darf nie zum Löschen von Übersetzungen führen.","unsure":false,"unsureNote":""},{"id":"gateway","label":"Shopify-Gateway\n(GraphQL)","kind":"server","col":3,"row":2,"desc":"ShopifyApiGateway reiht Shopify-Aufrufe in eine Warteschlange (max. 10 pro Sekunde, bis zu 3 Wiederholungen bei Drosselung). Es wird pro Anfrage bzw. pro Hintergrundlauf neu erzeugt und von Editor-Actions, Bulk-Editor, Syncs und Reparaturen gleichermaßen genutzt; einzelne Routen rufen admin.graphql direkt.","files":["app/services/shopify-api-gateway.service.ts"],"functions":["ShopifyApiGateway"],"rule":"Das Gateway arbeitet mit einem einzigen seriellen Verbraucher: parallele Aufrufe bringen keine Zeit, nur Wiederholungs-Wartezeiten blockieren alles.","unsure":false,"unsureNote":""},{"id":"shopify_api","label":"Shopify Admin\nGraphQL API","kind":"shopify","col":4,"row":2,"desc":"Die Wahrheit über Produkte, Seiten, Übersetzungen, Märkte, Themes. Die App liest und schreibt hier. Ein Schreiben gilt erst als erfolgreich, wenn Shopify das Ergebnis zurückmeldet (Echo).","files":["app/graphql/content.mutations.ts","app/graphql/content.queries.ts"],"functions":["TRANSLATE_CONTENT_VERIFIED","REMOVE_TRANSLATIONS"],"rule":"userErrors: [] allein reicht nicht - nur ein zurückgemeldetes Ergebnis zählt als gespeichert. Ein #graphql-Dokument enthält keine Kommentare und kein Nicht-ASCII.","unsure":false,"unsureNote":""},{"id":"db","label":"Datenbank\n(PostgreSQL, Prisma)","kind":"db","col":4,"row":3,"desc":"Lokale Kopie (Cache) der Shopify-Inhalte plus Übersetzungen, Aufgaben (Task), Einstellungen, Sync-Stände, SEO-Daten und Abrechnung. Jede Zeile gehört zu einem Shop (shop-Spalte); die Editoren zeigen die Daten aus diesem Cache.","files":["prisma/schema.prisma","app/db.server.ts"],"functions":["db"],"rule":"Multi-Tenant: jede Zeile ist nach Shop getrennt; Übersetzungen zusätzlich nach locale, Theme-Inhalte nach themeId + marketId.","unsure":false,"unsureNote":""},{"id":"serverjs","label":"server.js Jobs\n(Task-Recovery)","kind":"job","col":3,"row":4,"desc":"Der Express-Startpunkt startet beim Boot Aufräum-Dienste: Task-Cleanup, DSGVO-Audit-Cleanup, Wiederherstellung hängender Aufgaben (Task-Recovery mit Reaper). WebP-Verarbeitung und Bild-Bereinigung sind vorgesehen, laufen in Produktion derzeit aber nicht (noch gesperrt). Nur eine Instanz hält die Sperre (Postgres-Sperre) und startet die Dienste.","files":["server.js","task-recovery.service.js","task-cleanup.service.js","orphan-run-recovery.js"],"functions":["recoverPendingTasks","markStuckTasksAsFailed","recoverOrphanedRuns"],"rule":"Ein abgerissener Hintergrundlauf (z. B. Crawl bei Redeploy) darf nicht ewig als 'läuft' stehen bleiben: orphan-run-recovery.js entscheidet zentral, wann ein Lauf tot ist. Beim Boot wird ohne Altersprüfung aufgeräumt.","unsure":false,"unsureNote":""}],"edges":[{"from":"admin","to":"shell","label":"Seitenaufruf"},{"from":"admin","to":"api","label":"fetch","style":"dashed"},{"from":"shell","to":"pages","label":"eingebettet"},{"from":"admin","to":"pages","label":""},{"from":"pages","to":"actions","label":"Speichern"},{"from":"api","to":"services","label":""},{"from":"actions","to":"services","label":""},{"from":"actions","to":"ai","label":"KI-Texte"},{"from":"services","to":"ai","label":"Übersetzen","style":"dashed"},{"from":"actions","to":"gateway","label":"Schreibaufrufe"},{"from":"services","to":"gateway","label":"Sync"},{"from":"gateway","to":"shopify_api","label":"GraphQL"},{"from":"services","to":"db","label":"Prisma"},{"from":"shopify_wh","to":"webhooks","label":"Ereignis"},{"from":"webhooks","to":"services","label":"Sync"},{"from":"webhooks","to":"ticks","label":"Wiederholung","style":"dashed"},{"from":"ticks","to":"services","label":"Sweeps"},{"from":"ticks","to":"db","label":"Stempel/Retry"},{"from":"storefront","to":"proxy","label":"/apps/contentpilot"},{"from":"proxy","to":"services","label":""},{"from":"serverjs","to":"db","label":"Tasks aufräumen"},{"from":"api","to":"pages","label":"Seiten-Action","style":"dashed"},{"from":"actions","to":"db","label":"Spiegel"}]},{"id":"p2","title":"Inhalt bearbeiten & speichern","intro":"Der Händler bearbeitet Produkte, Kollektionen, Seiten, Blogs, Artikel oder Policies im gemeinsamen Editor. Beim Klick auf 'Speichern' in der Shopify-Speicherleiste baut der Editor ein Formular aus den geänderten Feldern und schickt es an die Action der Seite. Dort entscheidet sich: Primärsprache (direkt in Shopify schreiben), Fremdsprache (Übersetzung registrieren) oder Fremdsprache für einen Markt (Markt-Variante). Bei Übersetzungen gilt: Erst wenn Shopify die Schlüssel zurückmeldet, wird die lokale Zeile geschrieben. Bei Primärtexten wird das Produkt nur gespiegelt, wenn Shopify es zurückgibt; bei Seiten, Blogs, Artikeln und Kollektionen werden die gesendeten Texte gespiegelt, nur Attribute (Tags, Vorlage, Sichtbarkeit) kommen aus der Shopify-Antwort.","nodes":[{"id":"loader","label":"Editor-Daten\nuseUiDataLoader","kind":"ui","col":0,"row":0,"desc":"Hält den Zustand des Editors: welche Werte gerade angezeigt werden (Primärtext, Übersetzung, Markt-Override) und was der Händler schon geändert hat. Die geladenen Elemente bleiben unverändert (nur lesen); Änderungen liegen in eigenen Zwischenspeichern darüber.","files":["app/hooks/useUiDataLoader.ts"],"functions":["useUiDataLoader","preserveUnsavedEdits","buildLocaleKey"],"rule":"Items sind schreibgeschützt - nie item.translations ändern. Mehrere Zwischenspeicher (gelöschte Schlüssel, lokale Übersetzungen, gespeicherte Primärwerte, beim Laden gelesene Werte, Ausgangswerte der Theme-Vorlagen) plus eine feste Prioritätsreihenfolge in resolve().","unsure":false,"unsureNote":""},{"id":"editor","label":"Content-Editor\nUnifiedContentEditor","kind":"ui","col":0,"row":1,"desc":"Die gemeinsame Oberfläche für alle Inhaltstypen: Sprachleiste, Marktauswahl, Felder, SEO-Seitenleiste. Der Hook useUnifiedContentEditor verdrahtet Daten, Änderungserkennung und Speichern; die Felder kommen aus app/config/content-fields.config.tsx.","files":["app/components/UnifiedContentEditor.tsx","app/hooks/useUnifiedContentEditor.ts","app/hooks/useEditorChangeDetection.ts","app/config/content-fields.config.tsx"],"functions":["UnifiedContentEditor","useUnifiedContentEditor","useEditorChangeDetection"],"rule":"Änderungen werden gegen die beim Laden festgehaltene Ausgangsbasis erkannt, nicht gegen das lebende Element - sonst überschreibt z. B. eine Meta-Description-Änderung unbemerkt andere Felder.","unsure":false,"unsureNote":""},{"id":"save","label":"Speicherleiste &\nFormular bauen","kind":"ui","col":1,"row":1,"desc":"Die native Shopify-Speicherleiste (AppSaveBar) leuchtet bei Änderungen. 'Speichern' ruft handleSave auf: es bestimmt die geänderten Felder (getChangedFields) und baut das Formular (buildFieldsForSave). Bei Fremdsprachen werden nur geänderte Felder mitgeschickt, bei der Primärsprache alle Felder plus eine Liste, was wirklich geändert wurde. Gesendet wird als Formular an die Seite.","files":["app/components/AppSaveBar.tsx","app/hooks/useFieldHandlers.ts","app/hooks/useEditorAutoSave.ts","app/hooks/useSaveBar.ts"],"functions":["AppSaveBar","handleSave","buildFieldsForSave","getChangedFields","safeSubmit","confirmNavigation"],"rule":"Eine Änderung wird nie durch den Klick selbst gespeichert, sondern erst über die Speicherleiste. Bei einer Primärsprach-Speicherung ist das Vorhandensein eines Felds nicht die Absicht des Händlers: nur changedFields entscheidet, welche Übersetzungen veralten und welche Attribute (Tags, Hersteller, Status) geschrieben werden.","unsure":false,"unsureNote":""},{"id":"copy","label":"Kopier-Speichern\napi.content-editor-action","kind":"server","col":1,"row":2,"desc":"Einige Aktionen im Editor schicken ihre Speicherung per einfachem fetch statt über die Seite (z. B. 'in alle Sprachen kopieren', Alt-Texte, Optionen/Metafelder von Produkten). Diese Route führt dafür die eigene Action der jeweiligen Seite aus (nicht eine Kopie) und gibt JSON zurück. Erlaubt sind nur Seiten aus einer festen Liste und nur updateContent plus wenige Zusatzaktionen.","files":["app/routes/api.content-editor-action.tsx","app/services/editor/content-action-endpoint.shared.ts","app/hooks/useFieldHandlers.ts","app/hooks/useEditorAltText.ts"],"functions":["action","postContentEditorSave","contentEditorActionAllowed","contentEditorActionPage"],"rule":"Die Route hat keine eigene Prüfung: sie erreicht nur Seiten-Actions, die Plan- und Rechteprüfung schon selbst mitbringen. Sie ist keine zweite Tür zu den Editoren.","unsure":false,"unsureNote":""},{"id":"route","label":"Seiten-Action →\nUnified-Handler","kind":"server","col":2,"row":1,"desc":"Jede Inhaltsseite (z. B. app.products, app.pages) hat eine Action aus makeContentRouteAction: Anmeldung, Einstellungen laden, Plan prüfen. Dann übernimmt handleUnifiedContentActions: Es prüft die Ressourcen-ID, die KI-Freigabe und verteilt nach 'action' (updateContent, translateAll, createContent, deleteContent ...).","files":["app/utils/content-route-action.server.ts","app/actions/unified-content.actions.ts","app/routes/app.products.tsx"],"functions":["makeContentRouteAction","handleUnifiedContentActions"],"rule":"Alle Inhaltstypen laufen durch handleUnifiedContentActions - keine parallelen Handler. Direkt per POST erreichbare Aktionen müssen den Plan in der Action prüfen.","unsure":false,"unsureNote":""},{"id":"switch","label":"Update-Weiche\nhandleUpdateContent","kind":"server","col":2,"row":2,"desc":"Entscheidet nach Inhaltstyp und Sprache: Produkte gehen in den eigenen Produkt-Pfad, Metaobjekte in ihren Pfad, alles andere in den gemeinsamen Service. Ist die Sprache die Primärsprache, wird der Markt ignoriert; sonst wird die marktId aus dem Formular verwendet. Vorab wird ein evtl. übersetztes Handle gemerkt, danach folgen Handle-Weiterleitung und IndexNow-Meldung.","files":["app/actions/content/content-update.action.ts","app/actions/product/update.actions.ts","app/actions/content/metaobject-update.action.ts"],"functions":["handleUpdateContent","handleUpdateProduct","handleMetaobjectUpdate","finishHandleRedirect","finishIndexNow"],"rule":"Ein Handle-Wechsel schuldet der alten URL eine Weiterleitung (Shopifys zurückgemeldetes Handle zählt, nicht das gesendete). Weil Seiten/Artikel/Blogs keinen Webhook haben, ist das Speichern der einzige Moment für die IndexNow-Meldung.","unsure":false,"unsureNote":""},{"id":"primary","label":"Primärsprache\nSpeichern","kind":"server","col":3,"row":1,"desc":"Schreibt den Originaltext direkt in Shopify: Produkte per productUpdate (nur gesendete Felder, SEO immer als Paar), Seiten/Blogs/Artikel/Kollektionen/Policies über ShopifyContentService.updateContent. Danach wird die lokale Datenbank aktualisiert und geprüft, welche Übersetzungen durch die Änderung veraltet sind.","files":["app/actions/product/update.actions.ts","src/services/shopify-content.service.ts"],"functions":["updatePrimaryProduct","updateContent","updateCollection","updatePage","updateArticle"],"rule":"Partielle SEO-Speicherungen löschen sonst die andere Hälfte - immer beide Hälften senden oder die ungeänderte erhalten. Bei Produkten darf der Titel in der Primärsprache nicht leer werden. Primärspeicherungen sind immer global (nie marktspezifisch).","unsure":false,"unsureNote":""},{"id":"foreign","label":"Fremdsprache\nÜbersetzung speichern","kind":"server","col":3,"row":2,"desc":"Liest zuerst die Shopify-Prüfsummen (Digests) des Originaltexts und registriert dann die Übersetzung per translationsRegister - eine Sprache pro Aufruf. Der Standardpfad (updateContent) prüft das Echo selbst, der Produktpfad nutzt registerAndVerify. Geleerte Felder werden per translationsRemove entfernt. Ein Feld ohne Digest wird nicht an Shopify geschickt, aber trotzdem lokal gespeichert.","files":["src/services/shopify-content.service.ts","app/actions/product/update.actions.ts","app/services/translations/verified-translations.server.ts","app/services/translations/translation-keys.shared.ts"],"functions":["loadTranslatableContent","updateContent","updateTranslatedProduct","registerAndVerify","mirrorConfirmedContentTranslations"],"rule":"Die DB-Zeile wird auch ohne Shopify-Digest geschrieben (translationsRegister braucht einen, Prisma nicht). Ein Handle gleich dem Primär-Handle wird übersprungen (doppelte Slugs). Bestätigt Shopify nur einen Teil, nennt die Antwort die nicht gespeicherten Felder (unconfirmedFields, unconfirmedClearedFields, skippedFields); die Seite lässt genau diese als ungespeichert stehen. Feld zu Shopify-Schlüssel kommt aus der einen Tabelle in translation-keys.shared.ts.","unsure":false,"unsureNote":""},{"id":"market","label":"Markt-Variante\n(Override)","kind":"server","col":3,"row":3,"desc":"Eine Fremdsprach-Speicherung mit marktId schreibt über denselben Fremdsprach-Pfad eine eigene Zeile nur für diesen Markt (z. B. Deutsch für die Schweiz). Sie ist in ContentTranslation eine eigene Zeile mit gleicher Ressource, gleichem Schlüssel und gleicher Sprache plus marktId. Ändert sich später der Primärtext, löscht purgeMarketOverrides diese Markt-Varianten (nie neu übersetzt).","files":["app/services/translations/market-layer-purge.server.ts","app/services/translations/translation-locks.shared.ts","app/utils/market-translations.server.ts","app/actions/content/content-update.action.ts"],"functions":["purgeMarketOverrides","marketLayerLockId","marketOverrideKey"],"rule":"Der Override fliegt genau dann, wenn auch die globale Zeile daneben gelöscht oder neu übersetzt wird; mit beiden Schaltern aus bleibt alles. Je Aufruf wird nur EIN Markt entfernt, weil das Echo den Markt nicht nennt. Ein Handle-Override bleibt bei einer Auffrischung bestehen (er ist eine Adresse).","unsure":false,"unsureNote":""},{"id":"repair","label":"Veraltete Übersetzungen\nlöschen / neu übersetzen","kind":"server","col":4,"row":1,"desc":"Nach einer Primär-Änderung sind Übersetzungen des alten Texts veraltet. Je nach Händler-Einstellung werden sie in allen Fremdsprachen gelöscht (mit Echo-Prüfung) oder - bei eingeschalteter Auto-Übersetzung - im Hintergrund neu übersetzt. Beides zugleich gibt es nicht: Auto-Übersetzung hat Vorrang.","files":["app/services/translations/translation-change-policy.server.ts","app/services/translations/stale-translation-sync.server.ts","app/services/translations/verified-translations.server.ts"],"functions":["loadTranslationChangePolicy","isPurgeOnPrimaryChangeEnabled","reconcileAfterPrimarySave","removeAndVerifyAcrossLocales"],"rule":"Ob gelöscht wird, entscheidet der Händler-Schalter (Einstellungen → Übersetzungen) und genau ein Modul. Bei Fehlern wird zugunsten des Löschens entschieden, weil eine veraltete Übersetzung unsichtbar bleibt. Die Neuübersetzung läuft als Hintergrund-Task; eine bestätigte Übersetzung wird nie zurückgenommen.","unsure":false,"unsureNote":""},{"id":"shopify","label":"Shopify\nMutation","kind":"shopify","col":4,"row":2,"desc":"Die eigentlichen Schreib-Aufrufe: productUpdate / pageUpdate / collectionUpdate / articleUpdate (Primärtext), translationsRegister (Fremdsprache, optional mit Markt) und translationsRemove (Löschen).","files":["app/graphql/content.mutations.ts","app/actions/product/update.actions.ts"],"functions":["TRANSLATE_CONTENT_VERIFIED","REMOVE_TRANSLATIONS","productUpdate"],"rule":"Meta-Titel/-Beschreibung von Seiten, Blogs und Artikeln liegen in Metafeldern (global.title_tag / description_tag): Leeren geht nur über metafieldsDelete, nicht mit leerem Wert.","unsure":false,"unsureNote":""},{"id":"echo","label":"Echo-Prüfung","kind":"server","col":4,"row":3,"desc":"Eine Übersetzung zählt nur, wenn Shopify die Schlüssel in der Antwort zurückmeldet - 'keine Fehler' reicht nicht. Beim Produkt heißt das: das Produkt kommt zurück; bei Übersetzungen: (Sprache, Schlüssel) steht im Echo. Beim Löschen wird bei Lücke noch einmal nachgelesen.","files":["src/services/shopify-content.service.ts","app/services/translations/translation-echo.shared.ts","app/services/translations/verified-translations.server.ts","app/services/editor/unconfirmed-cleared.shared.ts"],"functions":["readTranslationEcho","findEchoFor","featuredAltEchoProblem","removeAndVerify"],"rule":"Historischer Fehler: Shopify nimmt den Aufruf an, speichert aber nichts. Deshalb gilt nur das Echo. Eine lokale Zeile wird nur gelöscht, wenn Shopify die Löschung bestätigt (Echo oder erneutes Lesen).","unsure":false,"unsureNote":""},{"id":"db","label":"Datenbank-Spiegel\n(Prisma)","kind":"db","col":4,"row":4,"desc":"Inhaltstabellen (Product, Page, Article, Collection ...) mit den gesendeten Texten, Attribute aus dem Shopify-Echo; Fremdsprachen in ContentTranslation (Schlüssel: Shop, Ressource, Key, Sprache, Markt) nur für bestätigte Schlüssel, bzw. ohne Prüfsumme (Digest) als reine Lokal-Zeile.","files":["prisma/schema.prisma","src/services/shopify-content.service.ts"],"functions":["upsert","markTranslationSaved"],"rule":"Übersetzungs-Spiegel und Attribute folgen dem Echo (Shopify normalisiert z. B. Tags). Nach dem Speichern wird die Ressource kurz markiert, damit ein Webhook-Sync mit noch veralteten Shopify-Daten die Änderung nicht rückgängig macht.","unsure":false,"unsureNote":""}],"edges":[{"from":"loader","to":"editor","label":"Werte anzeigen"},{"from":"editor","to":"save","label":"Änderungen"},{"from":"editor","to":"copy","label":"Kopieren (fetch)","style":"dashed"},{"from":"save","to":"route","label":"absenden"},{"from":"copy","to":"route","label":"Seiten-Action"},{"from":"route","to":"switch","label":"updateContent"},{"from":"switch","to":"primary","label":"Primärsprache"},{"from":"switch","to":"foreign","label":"Fremdsprache (+ marktId)"},{"from":"primary","to":"shopify","label":"Mutation"},{"from":"foreign","to":"shopify","label":"Register/Remove"},{"from":"market","to":"shopify","label":"Markt-Variante"},{"from":"primary","to":"repair","label":"danach","style":"dashed"},{"from":"repair","to":"shopify","label":"Remove"},{"from":"shopify","to":"echo","label":"Antwort"},{"from":"echo","to":"db","label":"nur bestätigt"},{"from":"primary","to":"market","label":"Varianten löschen","style":"dashed"}]},{"id":"p3","title":"Übersetzungen schreiben & löschen","intro":"Übersetzungen leben an zwei Orten: bei Shopify (damit der Online-Shop sie ausliefert) und in der eigenen Datenbank (damit die Editoren sie anzeigen). Eine Übersetzung gilt nur dann als gespeichert oder gelöscht, wenn Shopify das in seiner Antwort bestätigt. Erst dann wird die lokale Zeile geschrieben bzw. entfernt. Dazu kommen die Ebenen (global oder pro Markt) und kurze Sperren, damit Hintergrundläufe frisch gespeicherte Werte nicht überschreiben.","nodes":[{"id":"locks","label":"Speicher-Sperren\n(Locks)","kind":"server","col":0,"row":0,"desc":"Jede Speicherung markiert die Ressource kurz (Prüffenster 30 Sekunden) im Arbeitsspeicher des Prozesses. Automatische Reparaturen und Syncs sehen die Markierung und überschreiben dann nichts. Es gibt eigene Schlüssel pro Bereich (Bild-Alt-Texte, Optionen/Metafelder, Kollektions-Bild-Alt, Markt-Ebene), damit sich Reparaturen verschiedener Bereiche nicht gegenseitig aussperren.","files":["app/utils/translation-save-lock.server.ts","app/services/translations/translation-locks.shared.ts"],"functions":["markTranslationSaved","isTranslationRecentlySaved","altTextLockId","mediaAltLockId","subResourceLockId","featuredAltLockId","marketLayerLockId"],"rule":"Jeder Pfad, der eine Übersetzung schreibt, muss den passenden Schlüssel markieren - sonst überschreibt ein Hintergrundlauf einen eben gespeicherten Händlerwert. Eine MARKT-Speicherung markiert marketLayerLockId statt des normalen Schlüssels (die Marktebene wird von Syncs mit überschrieben, von Reparaturen nicht).","unsure":false,"unsureNote":""},{"id":"sync","label":"Sync &\nAuto-Reparatur","kind":"job","col":2,"row":0,"desc":"Syncs lesen Übersetzungen von Shopify neu ein ('löschen, was gelesen wurde, neu einfügen'). Schlägt das Lesen einer Sprache fehl, bleiben deren lokale Zeilen erhalten statt gelöscht zu werden. Die Auto-Reparatur übersetzt veraltete Texte neu und nutzt dieselben geprüften Schreib-Funktionen.","files":["app/services/sync-utils.ts","app/services/translations/stale-translation-sync.server.ts"],"functions":["translationWriteScope","reconcileStaleTranslations","contentTranslationMirror"],"rule":"Ein fehlgeschlagenes Lesen ist kein Löschen: eine Sprache, die nicht gelesen werden konnte, behält ihre Zeilen (failedGlobalLocales / failedMarketIds). Unveröffentlichte Sprachen gelten wie aktive - sie werden mitgelesen und mitübersetzt.","unsure":false,"unsureNote":""},{"id":"digest","label":"Digests lesen\n(fetchDigests…)","kind":"server","col":1,"row":1,"desc":"Shopify verlangt beim Registrieren eine Prüfsumme (Digest) des Originaltexts. Diese Stufe liest sie je Schlüssel und schickt nur Schlüssel mit Digest an Shopify. Schlüssel ohne Digest werden gemeldet und können trotzdem lokal gespiegelt werden. registerWithDigests ist die Kombination aus Lesen und Schreiben für eine Sprache (aktuell nur eine Route nutzt sie); die meisten Schreibstellen lesen die Digests selbst und rufen registerAndVerify direkt auf.","files":["app/services/translations/verified-translations.server.ts"],"functions":["fetchDigestsForResource","fetchDigestsForResourceDetailed","loadDigestsForRows","registerWithDigests"],"rule":"Digests sind für translationsRegister Pflicht, für Prisma nicht: die DB-Zeile wird auch ohne Digest geschrieben. Jeder Schreibpfad spiegelt den Digest in die Zeile (Grundlage für die Erkennung veralteter Übersetzungen).","unsure":false,"unsureNote":""},{"id":"register","label":"registerAndVerify\n(Schreiben + Echo)","kind":"server","col":2,"row":1,"desc":"Sendet translationsRegister für eine Ressource und vergleicht die Antwort mit dem Gesendeten. Nur Schlüssel, die Shopify zurückmeldet, gelten als bestätigt - und es zählt der Wert, den Shopify gespeichert hat. Eigene Varianten gibt es für Bild-Alt-Texte (registerMediaAltAndVerify).","files":["app/services/translations/verified-translations.server.ts","app/services/translations/translation-echo.shared.ts"],"functions":["registerAndVerify","registerMediaAltAndVerify","findEchoFor"],"rule":"Ein Speichern ist nur erfolgreich, wenn Shopify die Schlüssel zurückmeldet - userErrors allein reicht nicht (Fehlerbild: Shopify nimmt an, speichert nichts).","unsure":false,"unsureNote":""},{"id":"callers","label":"Schreibstellen\n(Editor, Bulk, KI ...)","kind":"server","col":0,"row":2,"desc":"Alle Stellen, die Übersetzungen anlegen oder entfernen: der Inhalts-Editor, der Bulk-Editor (auch 'fehlende Übersetzungen ergänzen'), die KI-Übersetzung, Optionen/Metafelder, Alt-Texte, Theme-Vorlagen, Menüs und Metaobjekte. Die meisten nutzen das gemeinsame Modul verified-translations.server.ts.","files":["app/actions/content/translation.action.ts","app/actions/content/sub-resources.action.ts","app/actions/content/alt-text.action.ts","app/services/bulk-editor/apply.server.ts","app/services/bulk-editor/translations.server.ts","src/services/shopify-content.service.ts","app/actions/templates/templates-update.action.ts","app/services/menu-translations.server.ts","app/actions/content/metaobject-update.action.ts"],"functions":["persistSubResourceTranslations","translationKeyForColumn","saveTranslations"],"rule":"Fremdwerte gehen in Shopify UND in die lokale DB. Die DB-Zeile wird auch ohne Shopify-Digest geschrieben. Im Bulk-Editor wird per Zelle (nicht pro Zeile) gemeldet, was fehlschlug. Wer translationsRegister/Remove senden darf, ist per Test festgelegt (translation-write-guard.test.ts); neue Schreiber gehen über verified-translations.server.ts. Der Editor-Speicherpfad (updateContent) hat bewusst eine eigene Echo-Prüfung und steht auf dieser Erlaubnisliste.","unsure":false,"unsureNote":""},{"id":"shopify","label":"Shopify\ntranslationsRegister / Remove","kind":"shopify","col":2,"row":2,"desc":"Die Shopify-Mutationen für Übersetzungen. translationsRemove nimmt Schlüssel und Sprachen für jede Kombination aus Schlüssel und Sprache und optional eine Liste von Märkten; ohne Markt wird nur die globale Ebene entfernt.","files":["app/graphql/content.mutations.ts"],"functions":["TRANSLATE_CONTENT_VERIFIED","REMOVE_TRANSLATIONS"],"rule":"translationsRemove kann stillschweigend nichts tun und meldet zurück, was es GELÖSCHT hat: ein Schlüssel, der bei Shopify gar keine Übersetzung hatte, kommt leer zurück.","unsure":false,"unsureNote":""},{"id":"echo","label":"Echo auswerten","kind":"server","col":3,"row":2,"desc":"Vergleicht je (Sprache, Schlüssel) Gesendetes mit Zurückgemeldetem. Die Sprachschreibweise wird tolerant verglichen. Beim Registrieren zählt auch der Markt (checkMarket). Nur bestätigte Paare dürfen lokal geschrieben bzw. gelöscht werden.","files":["app/services/translations/translation-echo.shared.ts"],"functions":["findEchoFor","echoComparisonKey","localesMatch"],"rule":"Nur Echo-bestätigte Paare dürfen lokal gelöscht werden. Ein Löschen ohne Bestätigung behält die lokale Zeile.","unsure":false,"unsureNote":""},{"id":"remove","label":"removeAndVerify\n(+ AcrossLocales)","kind":"server","col":1,"row":3,"desc":"Löscht Übersetzungen per translationsRemove und prüft das Echo. removeAndVerify arbeitet für eine Sprache (mit Nachlesen bei Lücke), removeAndVerifyAcrossLocales für viele Sprachen in einem Aufruf (z. B. nach Primär-Änderung); removeVerifiedWithGapReread verbindet beides. Mit marktId wird nur die Markt-Variante entfernt, ohne marktId nur die globale.","files":["app/services/translations/verified-translations.server.ts"],"functions":["removeAndVerify","removeAndVerifyAcrossLocales","removeVerifiedWithGapReread","confirmedPairsWhere"],"rule":"Eine unbestätigte Löschung entfernt die lokale Zeile nicht. removeAndVerifyAcrossLocales liest selbst nie nach (ein Nachlesen pro Sprache wären ~9000 Zusatzaufrufe bei 200 Produkten); unbestätigte Paare gehen danach einzeln durch removeAndVerify, das bei einer Lücke nachliest. Ein leerer Wert zählt als abwesend.","unsure":false,"unsureNote":""},{"id":"reread","label":"Nachlesen bei Lücke","kind":"server","col":3,"row":3,"desc":"Meldet Shopify einen Schlüssel nicht zurück, wird nachgelesen, ob er in dieser Sprache und Ebene noch einen Wert hat. Hat er keinen mehr, gilt die Löschung als bestätigt. Ein fehlgeschlagenes oder leeres Nachlesen bestätigt nichts.","files":["app/services/translations/verified-translations.server.ts"],"functions":["translatedKeysForLocale"],"rule":"Drei Leitplanken: Fehlt die Ressource oder die Liste, ist das nicht beweiskräftig. Die marktId gehört in die ABFRAGE (translations(marketId: null) liefert nur global) - sonst würde jeder Markt-Schlüssel fälschlich als gelöscht bestätigt. Ein fehlgeschlagenes Nachlesen bestätigt nichts.","unsure":false,"unsureNote":""},{"id":"market","label":"Markt-Ebene\npurgeMarketOverrides","kind":"server","col":0,"row":4,"desc":"Neben der globalen Übersetzung kann ein Markt (z. B. Schweiz) eine eigene Variante derselben Sprache haben. Ändert sich der Primärtext, werden diese Overrides gelöscht - nie neu übersetzt. Es wird je Markt und Ressource ein eigener Löschaufruf gesendet und nur nach Echo lokal gelöscht.","files":["app/services/translations/market-layer-purge.server.ts","app/utils/market-translations.server.ts"],"functions":["purgeMarketOverrides","marketOverrideKey"],"rule":"Der Umfang sind alle geänderten Schlüssel x alle Sprachen, nicht nur das, was die globale Erkennung fand. Eine Zeile ohne marktId wird übersprungen (sonst würde die globale Übersetzung gelöscht). Wirft nie, weil es hinter einem erfolgreichen Primär-Schreiben läuft.","unsure":false,"unsureNote":""},{"id":"db_content","label":"ContentTranslation\n(Prisma)","kind":"db","col":4,"row":1,"desc":"Die Übersetzungen von Produkt, Kollektion, Artikel, Seite, Policy sowie Optionen, Metafeldern und Medien (resourceType unterscheidet). Eine Zeile je Shop, Ressource, Schlüssel, Sprache und Markt; marktId leer bedeutet global. Ohne Fremdschlüssel: Löschen muss die App selbst übernehmen.","files":["prisma/schema.prisma","app/services/translations/verified-translations.server.ts"],"functions":["mirrorConfirmedContentTranslations","confirmedPairsWhere"],"rule":"Es gibt keine DB-Sicherung per Fremdschlüssel: Löschen pro Ressource und DSGVO-Löschen sind Code-Pflicht. Der Spiegel schreibt den von Shopify zurückgemeldeten Wert, nicht den gesendeten.","unsure":false,"unsureNote":""},{"id":"db_other","label":"Weitere Tabellen\nTheme/Meta/Alt","kind":"db","col":4,"row":2,"desc":"Eigene Tabellen für andere Bereiche: ThemeTranslation (Theme-Inhalte; der eindeutige Schlüssel enthält Theme UND Markt), MetaobjectTranslation (Metaobjekt-ID + Feldschlüssel) und ProductImageAltTranslation (Bild-Alt-Texte, per Fremdschlüssel an die Bild-Cache-Zeile gebunden und wird mit ihr gelöscht). Alle haben ebenfalls eine marktId.","files":["prisma/schema.prisma","app/services/translations/stale-translation-sync.server.ts","app/services/translations/verified-translations.server.ts"],"functions":["themeTranslationMirror","metaobjectTranslationMirror","productImageAltMirror","mirrorProductMediaAlt"],"rule":"Die Bild-Cache-Zeile wird bei jedem Lesen/Schreiben neu aus (Produkt, Medium) ermittelt, nie gemerkt - der Produkt-Sync legt Bildzeilen mit neuen IDs neu an. Ein nicht auflösbares Bild wird gemeldet, nie unter geratener ID geschrieben.","unsure":false,"unsureNote":""}],"edges":[{"from":"callers","to":"locks","label":"markieren","style":"dashed"},{"from":"locks","to":"sync","label":"Sperre gesehen","style":"dashed"},{"from":"callers","to":"digest","label":"Schreiben"},{"from":"digest","to":"register","label":"mit Digest"},{"from":"register","to":"shopify","label":"Register"},{"from":"callers","to":"remove","label":"Löschen"},{"from":"market","to":"remove","label":"je Markt"},{"from":"callers","to":"market","label":"Primär geändert","style":"dashed"},{"from":"remove","to":"shopify","label":"Remove"},{"from":"shopify","to":"echo","label":"Antwort"},{"from":"echo","to":"db_content","label":"bestätigt: spiegeln"},{"from":"echo","to":"db_other","label":""},{"from":"echo","to":"reread","label":"Lücke","style":"dashed"},{"from":"sync","to":"db_content","label":"neu einlesen","style":"dashed"},{"from":"callers","to":"register","label":"direkt"},{"from":"reread","to":"db_content","label":"löschen","style":"dashed"},{"from":"reread","to":"db_other","label":"","style":"dashed"}]},{"id":"p4","title":"Hauptsprache geändert → was passiert mit Übersetzungen","intro":"Wenn sich ein Text in der Hauptsprache ändert, beschreiben die Übersetzungen in den anderen Sprachen plötzlich einen Text, den es nicht mehr gibt. Die App löst das auf drei Wegen: beim Speichern im Editor, über Shopify-Webhooks (Produkte, Kollektionen) und über einen nächtlichen Abgleich für Seiten, Artikel, Blogs und Richtlinien. Was dabei geschieht (löschen oder neu übersetzen) entscheidet eine Einstellung des Händlers.","nodes":[{"id":"change","label":"Text in Hauptsprache\ngeändert","kind":"ui","col":0,"row":2,"desc":"Der Händler ändert einen Text im App-Editor, im Shopify-Admin, in einer anderen App oder per Import. Je nach Quelle der Änderung greift ein anderer Erkennungsweg.","files":["app/hooks/useUnifiedContentEditor.ts"],"functions":[],"rule":"Änderung im Editor wird direkt beim Speichern repariert; Änderungen von außen werden über Webhooks bzw. den nächtlichen Abgleich bemerkt.","unsure":false,"unsureNote":""},{"id":"policy","label":"Händler-Einstellung\n(löschen/übersetzen)","kind":"server","col":3,"row":1,"desc":"Eine Einstellung unter Einstellungen → KI-Anweisungen → Übersetzungen entscheidet: Sollen veraltete Übersetzungen gelöscht werden (Standard: an) oder – nur im Max-Tarif – automatisch neu übersetzt werden? Ein einziges Modul beantwortet diese Frage für alle Stellen.","files":["app/services/translations/translation-change-policy.server.ts","app/services/translations/translation-change-policy.shared.ts","app/components/AIInstructionsTabs.tsx"],"functions":["isPurgeOnPrimaryChangeEnabled","loadTranslationChangePolicy"],"rule":"Beide Schalter sind Alternativen, Auto-Übersetzen gewinnt. Auto-Übersetzen schaltet das Löschen nur dort ab, wo eine Neuübersetzung auch wirklich läuft; überall sonst gilt die gespeicherte Lösch-Einstellung. Bei Fehler im Lesen wird trotzdem gelöscht (lieber löschen als unbemerkt veralteten Text behalten). Das Max-Flag wird bei jedem Lesen mit dem Tarif verknüpft.","unsure":false,"unsureNote":""},{"id":"save","label":"Speichern im Editor","kind":"server","col":1,"row":0,"desc":"Beim Speichern im Editor kennt die App die geänderten Felder genau. Sie übergibt sie direkt an die Reparatur und prüft nicht erst, ob sich etwas „bewiesen“ geändert hat. Gilt für Produkt, Kollektion, Seiten, Artikel, Blogs, Richtlinien, Unterressourcen, Metaobjekte u. a. und auch für Änderungen im Massen-Editor.","files":["app/services/translations/stale-translation-sync.server.ts","app/actions/product/update.actions.ts","src/services/shopify-content.service.ts","app/services/bulk-editor/retranslate.server.ts"],"functions":["reconcileAfterPrimarySave","updateContent"],"rule":"Ist Auto-Übersetzen an, wird vorher nicht gelöscht; die Reparatur übersetzt die geänderten Felder in ALLE Fremdsprachen – auch in noch nicht veröffentlichte und in Sprachen ohne bisherige Übersetzung. Ohne Auto-Übersetzen löscht die Speicherung selbst (mit Bestätigung durch Shopify).","unsure":false,"unsureNote":""},{"id":"webhook","label":"Webhook / Sync\n(Produkt, Kollektion)","kind":"server","col":1,"row":2,"desc":"Shopify meldet Änderungen an Produkten und Kollektionen per Webhook. Der Sync liest die Ressource neu und startet mit der Option „reconcileTranslations“ den Abgleich. Nur Änderungs-Ereignisse tun das, nie das Anlegen oder ein Voll-Sync.","files":["app/routes/webhooks.products.tsx","app/routes/webhooks.collections.tsx","app/services/product-sync.service.ts","app/services/content-sync.service.ts"],"functions":["reconcileTranslations","syncProduct","syncCollection"],"rule":"Opt-in pro Ressource: nur products/collections UPDATE, Retry-Sweeps und Einzel-Reloads. syncAll* und der Erst-Sync lösen nichts aus.","unsure":false,"unsureNote":""},{"id":"sweep","label":"Nächtlicher Abgleich\n(Seiten, Artikel …)","kind":"job","col":1,"row":4,"desc":"Für Seiten, Artikel, Blogs und Richtlinien sendet Shopify keinen Webhook. Ein täglicher Hintergrund-Job fragt deshalb pro Typ Shopify ab, erkennt geänderte Ressourcen und reicht sie an denselben Abgleich weiter.","files":["app/services/translations/translation-drift-scan.server.ts","app/services/translations/translation-drift-auto-run.service.ts"],"functions":["scanTranslationDrift","TranslationDriftAutoRunService"],"rule":"Nur für Shops mit eingeschaltetem Auto-Übersetzen und Max-Tarif. Ein Shop, der lange nicht abgeglichen wurde, bekommt nur einen Basis-Lauf ohne Übersetzung. Pro Typ gibt es eine Obergrenze an Übergaben.","unsure":false,"unsureNote":""},{"id":"reconcile","label":"Veränderung beweisen\n(Digest-Vergleich)","kind":"server","col":2,"row":2,"desc":"Der Abgleich vergleicht Shopify-Digests (Fingerabdrücke des Quelltextes) mit dem, was wir beim letzten Mal gesehen haben. Zwei Quellen: die Digests an jeder Übersetzungszeile und eine eigene Basis pro Ressource (PrimaryDigestBaseline). Veraltet ist nur, was sich seit unserem letzten Sync nachweislich bewegt hat. Für eine bestehende Übersetzung muss zusätzlich Shopify sie als veraltet melden oder der Haupttext muss geleert worden sein.","files":["app/services/translations/stale-translation-sync.server.ts","app/services/translations/stale-translations.shared.ts"],"functions":["reconcileStaleTranslations","loadPreviousTranslationDigests","findStaleTranslations"],"rule":"Goldene Regel: Kein gespeicherter Digest ⇒ kein Beweis ⇒ nichts passiert. Der erste Sync nach dem Deploy schreibt nur Basiswerte und übersetzt nichts. Das Shopify-Flag „outdated“ allein reicht nie als Auslöser. Der Voll-Sync legt Basiswerte nur an (create-only), er gleicht nicht ab.","unsure":false,"unsureNote":""},{"id":"brake","label":"Bremse vor dem Füllen","kind":"server","col":2,"row":3,"desc":"Nur für Sprachen, die noch gar keine Übersetzung haben (zweiter Weg über die Basis pro Ressource). Reihenfolge: (1) Ist das Tageslimit heute schon verbraucht? Dann sofort abbrechen, die Basiszeile bleibt unberührt. (2) Verweigert die verwaltete KI? (3) Ist die Sprache bei Shopify wirklich leer? (4) Die Änderung wird auf der Basiszeile „reserviert“ (nur wer zuerst kommt, gewinnt), damit mehrere Webhooks derselben Speicherung nicht doppelt übersetzen. (5) Eine Einheit des Tageslimits wird verbraucht.","files":["app/services/translations/stale-translation-sync.server.ts","prisma/schema.prisma"],"functions":["reserveFirstFillBudget","claimPrimaryBaseline","AutoTranslateFillBudget"],"rule":"Schutz vor Massenübersetzung bei einem Import. Tageslimit ist die Entscheidung des Händlers (leer = kein Limit); der Zähler schlägt bei DB-Fehlern zu (fail closed). Abgelehnte Einträge kommen auf die Retry-Liste.","unsure":false,"unsureNote":""},{"id":"repair","label":"Reparatur\n(Task im Hintergrund)","kind":"job","col":3,"row":2,"desc":"Die Reparatur läuft losgelöst von der Anfrage als Task: pro Sprache eine KI-Anfrage, das Ergebnis wird bei Shopify registriert und lokal gespiegelt. Gleichzeitig wird sofort gelöscht, was nicht neu übersetzt werden kann – aber nur, wenn die Lösch-Einstellung das erlaubt; was die App bewusst nicht anfasst (z. B. mehrzeilige Werte), bleibt nach der gespeicherten Einstellung.","files":["app/services/translations/stale-translation-sync.server.ts"],"functions":["repairStaleTranslations","runRetranslation","purgeStaleEntries","managedRepairRefusal"],"rule":"Eine bestätigte Übersetzung wird nie zurückgenommen. Speichert der Händler währenddessen selbst, bricht die Reparatur für diese Ressource ab. Lehnt die Managed-KI ab (z. B. Budget leer), wird NICHT gelöscht, sondern auf die Retry-Liste gesetzt.","unsure":false,"unsureNote":""},{"id":"market","label":"Markt-Überschreibungen\nlöschen","kind":"server","col":3,"row":4,"desc":"Shopify Markets kann pro Markt eine eigene Übersetzung derselben Sprache halten. Ändert sich der Quelltext, werden diese Überschreibungen gelöscht und nie neu übersetzt, weil niemand sie automatisch korrekt erzeugen könnte. Das Löschen wird nicht nur von der Reparatur, sondern auch von den Speicher-Wegen (Produkt, Unterressourcen, Vorlagen, Metaobjekte, Massen-Editor) aufgerufen.","files":["app/services/translations/market-layer-purge.server.ts"],"functions":["purgeMarketOverrides"],"rule":"Gelöscht wird genau dann, wenn auch die globale Zeile gelöscht oder neu übersetzt wird; mit beiden Schaltern aus bleibt alles. Ein Markt pro Aufruf, weil die Bestätigung von Shopify den Markt nicht nennt. Ein Handle (URL-Teil), dessen globale Übersetzung bleibt, behält auch seine Markt-Überschreibung; wird der globale Handle gelöscht, geht sie mit.","unsure":false,"unsureNote":""},{"id":"shopify","label":"Shopify\n(Übersetzungen)","kind":"shopify","col":4,"row":0,"desc":"Neue Werte gehen per translationsRegister zu Shopify, veraltete werden per translationsRemove entfernt. Ein Schreibvorgang gilt nur als erfolgreich, wenn Shopify die Schlüssel in seiner Antwort bestätigt (Echo).","files":["app/services/translations/verified-translations.server.ts"],"functions":["registerAndVerify","removeAndVerify"],"rule":"Löschen zählt nur mit bestätigtem Echo oder erneutem Lesen; unbestätigtes Löschen entfernt die lokale Zeile nicht.","unsure":false,"unsureNote":""},{"id":"db","label":"Lokale Datenbank\n(Spiegel)","kind":"db","col":4,"row":1,"desc":"Parallel schreibt die App die Übersetzungen in die eigene Datenbank (ContentTranslation u. a.), samt Digest. Dazu gehören die Basiszeilen PrimaryDigestBaseline und der Tageszähler AutoTranslateFillBudget.","files":["prisma/schema.prisma"],"functions":["PrimaryDigestBaseline","ContentTranslation"],"rule":"Lokale Zeile wird auch ohne Shopify-Digest geschrieben. Fehlgeschlagenes LESEN einer Sprache löscht deren Zeilen nicht.","unsure":false,"unsureNote":""},{"id":"retry","label":"Retry-Liste","kind":"db","col":4,"row":3,"desc":"Was wegen Tageslimit oder Fehler nicht geliefert wurde, landet pro Ressource in AutoTranslateRetry. Der nächtliche Lauf arbeitet sie ab, höchstens zwei Versuche, und füllt nur Sprachen, die wirklich leer sind. Danach bleibt der Eintrag als „erschöpft“ in den Einstellungen sichtbar.","files":["app/services/translations/stale-translation-sync.server.ts","app/services/translations/translation-retry.server.ts","prisma/schema.prisma"],"functions":["processTranslationRetries","retryAutoTranslation","enqueueTranslationRetry","AutoTranslateRetry"],"rule":"Retry liest Shopify neu, überschreibt nie einen vorhandenen Wert und pausiert, ohne einen Versuch zu verbrauchen: wenn ein Lauf für dieselbe Ressource läuft, bei ausgeschaltetem Schalter, direkt nach einer Händler-Speicherung und bei verbrauchtem Limit. Handles kommen nie auf die Liste.","unsure":false,"unsureNote":""}],"edges":[{"from":"change","to":"save","label":"im Editor"},{"from":"change","to":"webhook","label":"in Shopify/extern"},{"from":"change","to":"sweep","label":"Seiten/Artikel","style":"dashed"},{"from":"policy","to":"save","label":"löschen oder KI?","style":"dashed"},{"from":"save","to":"repair","label":"geänderte Felder"},{"from":"webhook","to":"reconcile","label":"Sync + Abgleich"},{"from":"sweep","to":"reconcile","label":"geändert"},{"from":"reconcile","to":"brake","label":"leere Sprachen füllen"},{"from":"reconcile","to":"repair","label":"veraltet"},{"from":"brake","to":"repair","label":"freigegeben"},{"from":"brake","to":"retry","label":"Limit erreicht","style":"dashed"},{"from":"repair","to":"market","label":"Markt-Varianten löschen"},{"from":"repair","to":"shopify","label":"schreiben / löschen"},{"from":"repair","to":"db","label":"Spiegel + Digest"},{"from":"repair","to":"retry","label":"nicht geliefert","style":"dashed"},{"from":"sweep","to":"retry","label":"abarbeiten","style":"dashed"},{"from":"retry","to":"repair","label":"erneut versuchen"},{"from":"save","to":"shopify","label":"löschen ohne Auto-Ü.","style":"dashed"},{"from":"policy","to":"repair","label":"darf löschen?","style":"dashed"}]},{"id":"p5","title":"KI-Aufrufe","intro":"Jeder KI-Knopf im Editor (generieren, übersetzen, in alle Sprachen übertragen) läuft über die Route /api/ai bzw. die Editor-Aktionen und endet im AIService, der den gewählten Anbieter anspricht. Davor entscheidet die App, mit wessen Schlüssel gerechnet wird (eigener Schlüssel oder verwaltete KI), prüft Plan und Budget und entscheidet, ob Bilder mitgeschickt werden dürfen. Jeder Aufruf wird im Verbrauchsbuch gezählt. Auch SEO-Aufgaben, Bulk-Übersetzen und die automatische Reparatur aus „Hauptsprache geändert“ laufen über denselben AIService.","nodes":[{"id":"buttons","label":"KI-Knöpfe im Editor","kind":"ui","col":0,"row":1,"desc":"Generieren, Übersetzen, „in alle Sprachen übertragen“, Alt-Text erzeugen. Die Hooks des Editors schicken je eine Aktion (z. B. generateAIText, translateField, translateFieldToAllLocales) an den Server.","files":["app/hooks/useFieldHandlers.ts","app/hooks/useUnifiedContentEditor.ts"],"functions":["translateFieldToAllLocales"],"rule":"Bei Shops mit nur einer Sprache sind Übersetzen-Knöpfe sichtbar, aber ausgegraut mit Hinweis.","unsure":false,"unsureNote":""},{"id":"api","label":"Route /api/ai","kind":"server","col":1,"row":0,"desc":"Zentrale Route für alle KI-Aktionen. Sie lädt die KI-Einstellungen, prüft Plan, dann Schlüssel-/Budget-Verweigerung und verteilt per Aktionsname auf die Handler. Ein abgelaufener Schlüssel oder eine Managed-Ablehnung wird als klarer Fehlercode zurückgegeben statt als 500.","files":["app/routes/api.ai.tsx"],"functions":["aiRefusalFor","planGateRefusal","isManagedRefusal"],"rule":"Die Route ist direkt per POST erreichbar, deshalb ist der Plan-Check in der Route selbst, nicht nur in der Seite. Nicht-KI-Aktionen sind vom Schlüsselzwang ausgenommen.","unsure":false,"unsureNote":""},{"id":"handlers","label":"Handler\n(Text, Übersetzung, Alt)","kind":"server","col":1,"row":1,"desc":"Je Aktion ein Handler: Textgenerierung, Feld übersetzen, in alle Sprachen übersetzen, Alt-Texte, Bulk-Übersetzung. Sie holen sich den AIService über eine gemeinsame Hilfsfunktion.","files":["app/routes/api-ai-handlers/text-generation.handler.ts","app/routes/api-ai-handlers/text-translation.handler.ts","app/routes/api-ai-handlers/alt-text.handler.ts","app/routes/api-ai-handlers/shared.ts"],"functions":["handleGenerateAIText","handleTranslateField","handleTranslateFieldToAllLocales"],"rule":"Alle Handler holen den Dienst über aiServiceFor; Auth-Fehler werden zentral in der Route in INVALID_AI_KEY übersetzt.","unsure":false,"unsureNote":""},{"id":"actions","label":"Editor-Aktionen\n(Alle übersetzen)","kind":"server","col":1,"row":2,"desc":"„Alle übersetzen“ geht per Formular an die Seiten-Aktion der jeweiligen Inhaltsseite (gebaut von makeContentRouteAction, Plan-Prüfung auf dem Server) und weiter an handleUnifiedContentActions. Dort prüft aiRefusalFor zuerst Einwilligung und Budget, danach wird der Schlüssel über aiCredentialsFor aufgelöst; translateAllContent übersetzt und registriert bei Shopify.","files":["app/actions/unified-content.actions.ts","app/actions/content/translation.action.ts","src/services/shopify-content.service.ts","app/utils/content-route-action.server.ts","app/utils/ai-refusal-response.server.ts"],"functions":["handleTranslateAll","translateAllContent","makeContentRouteAction","aiCredentialsFor","aiRefusalFor"],"rule":"Aktionen laufen alle durch handleUnifiedContentActions; keine parallelen Handler.","unsure":false,"unsureNote":""},{"id":"vision","label":"Bild-Regel\n(Vision-Policy)","kind":"server","col":2,"row":3,"desc":"Der Browser bietet die Bilder des Eintrags als Kandidaten an (gewähltes Bild zuerst, ohne Doppelte, höchstens 5). Der Server entscheidet anhand der Shop-Einstellung, ob und wie viele davon mitgehen (1–5); Alt-Text nimmt immer genau eins. Eine einzige Shop-Einstellung steuert das.","files":["app/services/ai/vision-policy.shared.ts","app/hooks/useFieldHandlers.ts","app/routes/api-ai-handlers/text-generation.handler.ts","app/routes/api-ai-handlers/alt-text.handler.ts"],"functions":["visionImageUrls","resolveVisionPolicy","aiImageCandidates"],"rule":"Das Flag steht nicht mehr im Request: ein Client-„Ja“ ist keine Erlaubnis. HuggingFace und DeepSeek haben keine Bildunterstützung. Nur absolute https-URLs werden gesendet (Filter im AIService).","unsure":false,"unsureNote":""},{"id":"creds","label":"Schlüssel-Auflösung","kind":"server","col":2,"row":1,"desc":"Entscheidet, wessen Schlüssel ein Aufruf nutzt. Plan mit „+ AI“ ⇒ verwaltete KI, sonst eigener Schlüssel, sonst Probier-Kontingent (nur nach bestätigter Datenschutz-Einwilligung). Diese Datei ist die einzige, die die MANAGED_AI_*-Variablen liest.","files":["app/services/ai/ai-credentials.server.ts","app/services/ai/managed-ai.shared.ts"],"functions":["aiCredentialsFor","aiServiceFor","resolveAiCredentials","wantsManagedAi"],"rule":"Die Plan-Wahl entscheidet, nicht ein Schalter. Managed ist pro Deployment opt-in (MANAGED_AI_ENABLED=true). Kann ein Shop nicht verwaltet bedient werden, fällt er auf den eigenen Schlüssel zurück; nur fehlende Einwilligung hat keinen Fallback.","unsure":false,"unsureNote":""},{"id":"budget","label":"Budget &\nProbier-Kontingent","kind":"server","col":3,"row":0,"desc":"Verwaltetes Budget in Mikro-Euro, pro Abrechnungsperiode. Dazu das einmalige Probier-Kontingent für Shops ohne bezahlte KI und ein globaler Pool pro Kalendermonat. Ist etwas erschöpft, entsteht eine Ablehnung. Geprüft wird zweimal: vor der Anfrage (Vorab-Prüfung in /api/ai und den Editor-Aktionen) und bei jedem einzelnen KI-Aufruf im Dienst.","files":["app/services/ai/managed-budget.server.ts","app/services/ai/managed-global-pool.server.ts","app/routes/api-ai-handlers/shared.ts"],"functions":["managedBudgetStatus","managedPeriodKey","globalPoolStatus","aiRefusalResponse"],"rule":"Ein nicht lesbares Pro-Shop-Budget lehnt ab (schützt Geld); globaler Pool und Ersatz-Anbieter erlauben im Zweifel. Das Probier-Kontingent gilt „einmal pro Shop, für immer“ und sein Wert wird beim Start eingefroren.","unsure":false,"unsureNote":""},{"id":"service","label":"AIService\n(mit Warteschlange)","kind":"server","col":3,"row":1,"desc":"Die zentrale KI-Klasse: baut Prompts, ergänzt Glossar, übersetzt Felder/Batches und führt Anfragen über die Warteschlange mit Rate-Limits und Wiederholungen aus. TranslationService ist ein dünner Wrapper darum. Eine Ablehnung wird als ManagedAiRefusedError geworfen.","files":["src/services/ai.service.ts","src/services/translation.service.ts","src/services/ai-queue.service.ts"],"functions":["AIService","ManagedAiRefusedError","AIQueueService","TranslationService"],"rule":"Ablehnung ist beim Resolver ein Wert, im Service ein typisierter Fehler: sonst würde die automatische Reparatur bei leerem Budget Übersetzungen LÖSCHEN. Bei Teilausfall kann ein Ersatz-Anbieter einspringen.","unsure":false,"unsureNote":""},{"id":"providers","label":"KI-Anbieter","kind":"ai","col":4,"row":1,"desc":"Anthropic (Claude), Gemini, OpenAI, HuggingFace, DeepSeek und Grok. Im Code heißen sie claude, gemini, openai, huggingface, deepseek, grok. Ein ungültiger Anbietername fällt auf Claude zurück.","files":["src/services/ai.service.ts"],"functions":["AIProvider","fetchImageAsBase64","isSendableImageUrl"],"rule":"Verwaltete KI ist nur für Anbieter erlaubt, die die App bepreisen kann (sonst bliebe das Budget wirkungslos); eingewilligt sind OpenAI und Anthropic. Gemini lädt Bilder selbst herunter.","unsure":false,"unsureNote":""},{"id":"ledger","label":"Nutzungs-\nVerbrauchsbuch","kind":"db","col":4,"row":2,"desc":"Jeder Aufruf wird in AiUsageCounter gezählt: Shop, Periode, Quelle (eigener/verwalteter Schlüssel), Anbieter, Modell, Funktion, geschätzt oder gemessen. Die Budgetprüfung liest dieselbe Tabelle. Auch Aufrufe mit eigenem Schlüssel werden gezählt. Bei verwalteter KI wird zusätzlich der globale Monatstopf hochgezählt. (Ledger = Verbrauchsbuch.)","files":["app/services/ai/usage-meter.server.ts","prisma/schema.prisma"],"functions":["recordAiUsage","addGlobalPoolSpend","AiUsageCounter"],"rule":"Alle Beträge sind ganzzahlige Mikro-Euro. Die Periode wird von einer einzigen Funktion (managedPeriodKey) bestimmt, sonst bliebe die Obergrenze wirkungslos.","unsure":false,"unsureNote":""},{"id":"result","label":"Ergebnis zurück\nin den Editor","kind":"ui","col":4,"row":0,"desc":"Die Antwort geht als JSON an den Editor. Beim Übertragen in alle Sprachen werden die Ergebnisse zusätzlich bei Shopify registriert und in der DB gespiegelt (siehe Pipeline Übersetzungen).","files":["app/hooks/useFieldHandlers.ts"],"functions":["translateFieldToAllLocales"],"rule":"","unsure":false,"unsureNote":""}],"edges":[{"from":"buttons","to":"api","label":"/api/ai POST"},{"from":"buttons","to":"actions","label":"Alle übersetzen"},{"from":"api","to":"handlers","label":"Aktion wählen"},{"from":"handlers","to":"vision","label":"Bild-URLs","style":"dashed"},{"from":"handlers","to":"creds","label":"Dienst holen"},{"from":"actions","to":"creds","label":"Dienst holen"},{"from":"creds","to":"service","label":"Schlüssel + Config"},{"from":"vision","to":"service","label":"erlaubte Bilder","style":"dashed"},{"from":"service","to":"providers","label":"Prompt"},{"from":"service","to":"ledger","label":"Verbrauch buchen"},{"from":"api","to":"budget","label":"Vorab-Prüfung","style":"dashed"},{"from":"service","to":"budget","label":"Prüfung je Aufruf","style":"dashed"},{"from":"service","to":"result","label":"Text","style":"dashed"}]},{"id":"p6","title":"Bilder & Alt-Texte","intro":"Hier geht es um die Produktbilder: Galerie und Bild-Manager im Editor, Alt-Texte samt Übersetzungen, Bilder, die pro Sprache ausgetauscht werden, und Theme-Bilder pro Sprache. Entwürfe sind: neue Medien, Reihenfolge, Variantenzuordnung und getippte Alt-Texte; sie werden erst mit dem einen Speichern-Balken des Editors geschrieben. Sofort geschrieben werden: Löschen, WebP-Umwandlung, Alt-Texte aus SKU bzw. Vorlagen (Massen-Alt-Panel) und „In alle Sprachen übersetzen“. Echo heißt hier: Shopify meldet den gespeicherten Wert zurück, und erst das zählt als Beleg.","nodes":[{"id":"gallery","label":"Galerie & Bild-Manager","kind":"ui","col":0,"row":1,"desc":"Die Oberfläche für Produkt- und Varianten-Galerien: Bilder hinzufügen, sortieren, einer Variante zuordnen, löschen. Entwürfe sind neue Medien, Reihenfolge und Variantenzuordnung; der Speichern-Balken des Editors leuchtet dann auf und löst die Speicherung aus. Sofort geschrieben werden dagegen Löschen, die WebP-Umwandlung und „Alt-Text aus SKU“. Beim Auswählen einer Datei fragt die App über /api/staged-upload bei Shopify eine temporäre Upload-Adresse an (stagedUploadsCreate); das verbraucht eine Bild-Operation des Monatskontingents. Das eigentliche Medium entsteht erst beim Speichern.","files":["app/components/image-manager/VariantImageManager.tsx","app/components/image-manager/SortableImageGrid.tsx","app/components/image-manager/VariantGallerySection.tsx","app/hooks/useVariantImageManager.ts","app/routes/api.staged-upload.tsx","app/components/image-manager/BulkImageUploadPanel.tsx"],"functions":["handleApply","useVariantImageManager","handleConfirmDelete"],"rule":"Eine Einstellung wird nie durch den Klick gespeichert, der sie ändert: Entwürfe warten auf den Speichern-Balken. Hier gilt das für Galerie, Reihenfolge und Alt-Texte; Löschen, WebP und SKU-Alt-Texte sind bewusst Sofort-Aktionen.","unsure":false,"unsureNote":""},{"id":"altui","label":"Alt-Text-Entwürfe","kind":"ui","col":0,"row":3,"desc":"Getippte, per KI erzeugte und in EINE Sprache übersetzte Alt-Texte sind Entwürfe, je Sprache und Markt. Erst der Speichern-Balken schickt alle geänderten Alt-Texte nacheinander durch eine einzige Warteschlange (ein Request gleichzeitig). Die Seite meldet „gespeichert“ nur für Texte, die der Server wirklich bestätigt hat. Ausnahme: „In alle Sprachen übersetzen“ schreibt sofort (nur globale Ebene) und ist gesperrt, solange der Haupt-Alt-Text ungespeichert ist.","files":["app/components/image-manager/alt-draft.ts","app/components/image-manager/VariantImageManager.tsx","app/routes/app.products.tsx"],"functions":["flushAltDrafts","dispatchNextAltSave","AltDraftApi"],"rule":"Alt-Text-Entwürfe werden nicht beim Verlassen des Feldes gespeichert (das war früher so und wurde abgeschafft), sondern erst über den einen Speichern-Balken.","unsure":false,"unsureNote":""},{"id":"locui","label":"Bild pro Sprache\n(Auswahl)","kind":"ui","col":0,"row":4,"desc":"In einer Fremdsprache kann der Händler zu einem Bild oder Video ein Ersatzmedium wählen, auch je Markt. Die Wahl ist ein Entwurf: nichts wird geschrieben, bis der Speichern-Balken gedrückt wird. Die Anzeige beruht immer auf der Antwort des Servers, nicht auf der Hoffnung des Browsers.","files":["app/components/localized-images/useLocalizedMedia.ts","app/components/localized-images/LocalizedMediaReplaceButton.tsx","app/components/localized-images/localized-media-view.shared.ts"],"functions":["useLocalizedMedia","LocalizedMediaSaveBridge","draftsToWrite"],"rule":"Auch hier gilt: Entwurf hinter dem einen Speichern-Balken des Editors (Entscheidung des Inhabers, 2026-10-01).","unsure":false,"unsureNote":""},{"id":"savegal","label":"Galerie speichern\n(Route)","kind":"server","col":1,"row":0,"desc":"Die Route /api/update-variant-galleries erledigt in einem Durchgang: neue Medien anlegen, Reihenfolge ändern, Varianten-Hauptbild setzen/leeren, Galerie-Metafelder schreiben und den lokalen Cache (galleryJson) aktualisieren. Shopify kennt keine Transaktion über diese Schritte; bei einem Fehler wird früh abgebrochen und gemeldet, welche Schritte schon liefen. Die Antwort enthält createdMedia (Staging-URL zu Medien-ID).","files":["app/routes/api.update-variant-galleries.tsx"],"functions":["completedSteps","createdMedia","clearVariantMainImages"],"rule":"Es wird bewusst nicht gewartet, bis neue Medien fertig verarbeitet sind: die Medien-ID ist ab dem Anlegen stabil. Ausnahme: Vorschauen von 3D-Modellen werden begrenzt abgefragt.","unsure":false,"unsureNote":""},{"id":"del","label":"Bilder löschen\n(sofort)","kind":"server","col":1,"row":1,"desc":"Löschen passiert sofort nach der Bestätigung im Dialog, ohne den Speichern-Balken. Die Route ruft productDeleteMedia auf und zählt nur das als gelöscht, was Shopify als gelöscht zurückmeldet. Danach werden die Ersatzbilder pro Sprache dieser Originale mit entfernt; ein Fehler dort lässt das Löschen bestehen und wird nur gemeldet. Danach wird das Hauptbild betroffener Varianten geleert (nur nach bestätigtem Löschen). Der Browser nimmt das Bild zuerst optimistisch weg und legt ein nicht bestätigtes wieder zurück.","files":["app/routes/api.delete-product-images.tsx","app/components/image-manager/delete-rollback.ts","app/components/image-manager/VariantImageManager.tsx"],"functions":["productDeleteMedia","removeEntriesForDeletedMedia","splitDeleteAnswer"],"rule":"Erfolg ist das Echo (Shopify meldet die gelöschten IDs zurück): jede angefragte ID muss als gelöscht zurückkommen, ein leeres userErrors reicht nicht.","unsure":false,"unsureNote":""},{"id":"altsave","label":"Alt-Text speichern\n(Route)","kind":"server","col":1,"row":3,"desc":"Die Alt-Text-Aktion des Produkt-Editors (saveImageAltText). In der Hauptsprache schreibt der Bild-Manager den Text mit fileUpdate und aktualisiert den Bild-Cache. In einer Fremdsprache, auch als Markt-Übersetzung, wird eine Übersetzung geprüft registriert (Digest = Prüfsumme des Quelltextes, Registrieren, Echo); leeren heißt dort die Übersetzung entfernen. Der Editor-Speichern selbst schreibt Alt-Texte über productUpdateMedia und wertet nur die userErrors aus. „Alt-Text aus SKU“ und die Alt-Text-Vorlagen schreiben ebenfalls sofort per fileUpdate.","files":["app/actions/content/alt-text.action.ts","app/actions/unified-content.actions.ts","app/actions/product/update.actions.ts"],"functions":["handleSaveImageAltText","saveImageAltTextPrimary","updateImageAltTexts","registerMediaAltAndVerify"],"rule":"Fremdsprachige Alt-Texte zählen nur mit S
