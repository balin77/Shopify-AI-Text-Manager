hopify-Echo als gespeichert (Spiegel: ProductImageAltTranslation, auch je Markt). Beim Haupt-Alt-Text prüfen Bild-Manager (fileUpdate) und Editor (productUpdateMedia) nur userErrors; das Echo wird übernommen, falls vorhanden.","unsure":false,"unsureNote":""},{"id":"locsrv","label":"Ersatzbild setzen/\nentfernen","kind":"server","col":1,"row":4,"desc":"Die Produktseiten-Aktionen localizedMediaLoad, localizedMediaSet und localizedMediaRemove. Sie erreichen den Server über /api/content-editor-action als zusätzliche Aktionen von /app/products, innerhalb von handleUnifiedContentActions. Der Server berechnet alle Werte selbst neu (Dateiname, Shopify-Bildadresse), nimmt vom Browser nichts ungeprüft an und schreibt nur „manual“ als Herkunft. Neue Ersatzbilder sind plan-abhängig (Bild-Manager-Tarif), Laden und Entfernen bleiben auf jedem Tarif möglich, damit man alte Ersetzungen immer wieder abbauen kann.","files":["app/actions/product/localized-media.action.ts","app/services/localized-media/localized-media.server.ts","app/actions/unified-content.actions.ts"],"functions":["handleLocalizedMediaAction","setLocalizedMedia","removeLocalizedImage","readProductLocalizedMedia"],"rule":"Ein Wert im Metafeld, den die App nicht geschrieben hat, wird nie überschrieben (foreignMetafieldValue).","unsure":false,"unsureNote":""},{"id":"shopmedia","label":"Shopify: Medien","kind":"shopify","col":2,"row":0,"desc":"Hier landen productCreateMedia, productReorderMedia, productVariantsBulkUpdate (Hauptbild der Variante), Metafeld-Writes für Galerie, Videos und 3D-Modelle sowie productDeleteMedia. Neue Medien existieren sofort mit ID, werden aber von Shopify noch verarbeitet.","files":["app/routes/api.update-variant-galleries.tsx","app/routes/api.delete-product-images.tsx"],"functions":["productCreateMedia","productReorderMedia","productVariantsBulkUpdate"],"rule":"","unsure":false,"unsureNote":""},{"id":"settling","label":"Bild in Verarbeitung","kind":"ui","col":2,"row":1,"desc":"Gerade gespeicherte Medien sind bei Shopify noch in Verarbeitung und tauchen in keiner Abfrage auf. Der Browser zeigt die lokale Vorschau unter der echten Medien-ID weiter an und fragt /api/product-variants in wachsenden Abständen (ca. 55 Sekunden) nach. Sobald die ID in der Medienliste erscheint, übernimmt die echte Kachel. Läuft die Zeit ab, bleibt die Kachel trotzdem stehen.","files":["app/components/image-manager/settling-media.ts","app/routes/api.product-variants.tsx"],"functions":["settlingPollDelayMs","unsettledMediaEntries","SettlingMediaEntry"],"rule":"Das Medium ist gespeichert und zählt nicht als ungespeicherte Änderung. Zeitablauf heißt 'wir fragen nicht mehr', nie 'Bild verwerfen'.","unsure":false,"unsureNote":""},{"id":"shopalt","label":"Shopify: Alt-Text &\nÜbersetzungen","kind":"shopify","col":2,"row":3,"desc":"Der Alt-Text selbst wird in der Hauptsprache mit fileUpdate (Bild-Manager, SKU, Vorlagen) oder productUpdateMedia (Editor-Speichern, Bulk-Editor für Produktbilder) geschrieben. Fremdsprachige Alt-Texte sind Übersetzungen auf dem Medium (Schlüssel alt) und werden mit translationsRegister geschrieben und per Echo geprüft. Auch übersetzte Theme-Bilder landen hier als normale Übersetzung.","files":["app/actions/content/alt-text.action.ts","app/services/translations/verified-translations.server.ts","app/services/bulk-editor/apply.server.ts","app/actions/product/update.actions.ts"],"functions":["writeMediaAltText","writeFileAltText","registerMediaAltAndVerify"],"rule":"productUpdateMedia ist veraltet, bleibt aber für Produktmedien der erprobte Weg (Editor, Bulk-Editor). fileUpdate nutzen der Bild-Manager (Einzel-Speichern, SKU, Vorlagen) und der Bulk-Editor für Bilder außerhalb des Katalogs.","unsure":false,"unsureNote":""},{"id":"metafield","label":"Shopify: Metafeld\nlocalized_media","kind":"shopify","col":2,"row":2,"desc":"Shopify kann ein Produktbild nicht pro Sprache speichern (nur der Alt-Text ist übersetzbar). Darum liegen alle Ersetzungen in EINEM JSON-Metafeld custom.localized_media am Produkt. Geschrieben wird die ganze Liste, bestätigt wird über das Echo; eine leere Liste löscht das Metafeld. Maximal 200 Einträge. Es gibt bewusst keine Datenbank-Kopie.","files":["app/services/localized-media/localized-media.shared.ts","app/services/localized-media/localized-media.server.ts"],"functions":["writeProductLocalizedMedia","LOCALIZED_MEDIA_KEY","MAX_LOCALIZED_MEDIA_ENTRIES"],"rule":"Das Metafeld ist der einzige Speicher; jede Anzeige liest es live. Gespeicherte Werte (Dateiname, Shopify-Bildadresse) werden vor dem Schreiben geprüft, weil das Storefront ihnen vertraut.","unsure":false,"unsureNote":""},{"id":"db","label":"Datenbank:\nBild-Cache","kind":"db","col":3,"row":1,"desc":"Lokale Spiegel: ProductImage (Bilder samt Alt-Text und mediaId), ProductVariant.galleryJson und ProductImageAltTranslation (Alt-Übersetzungen je Sprache und Markt). Geschrieben wird beim Galerie-Speichern, beim Alt-Text-Speichern und vom Produkt-Sync (products/update-Webhook), der die Bildzeilen neu aufbaut. Änderungsmarken verhindern, dass dieser Webhook frisch gespeicherte Alt-Texte überschreibt.","files":["prisma/schema.prisma","app/routes/api.product-images.tsx"],"functions":["ProductImageAltTranslation","altTextModifiedAt"],"rule":"Der Sync löscht und legt ProductImage-Zeilen neu an (neue IDs); Übersetzungen werden über die mediaId wieder zugeordnet, nie über eine gemerkte Zeilen-ID.","unsure":false,"unsureNote":""},{"id":"repair","label":"Alt-Übersetzung\nreparieren","kind":"job","col":3,"row":3,"desc":"Ändert sich ein Hauptsprachen-Alt-Text, stimmen die Übersetzungen nicht mehr. Ein gemeinsames Modul erfasst vor dem Schreiben den alten Alt-Text, vergleicht nach dem Schreiben nur echte Änderungen und übersetzt bei eingeschaltetem Auto-Übersetzen neu (KI). Ohne Auto-Übersetzen entscheidet die gespeicherte Lösch-Einstellung, ob die Übersetzungen geprüft entfernt werden. Der Lauf ist ein Hintergrund-Task; bei einem einzelnen Bild gilt die Sperre pro Medium.","files":["app/services/translations/product-alt-repair.server.ts","app/services/translations/translation-locks.shared.ts"],"functions":["repairChangedProductAlts","snapshotProductAlts","repairAltsAfterWrite","mediaAltLockId"],"rule":"Jeder Schreibweg für Haupt-Alt-Texte repariert über genau dieses Modul (Bild-Manager, SKU, Vorlagen, Editor, SEO-Massenkorrektur über die Editor-Speicherwege).","unsure":false,"unsureNote":""},{"id":"storefront","label":"Storefront:\nBild-Tausch","kind":"storefront","col":3,"row":2,"desc":"Das App-Embed 'Bilder pro Sprache' liest das Metafeld, blendet Originale vor dem ersten Zeichnen aus und ersetzt per Skript die Bild-Adressen (und Video-Quellen) passend zu Sprache und Markt des Besuchers. Der Abgleich läuft über den Dateinamen. Ein Snippet tauscht außerdem og:image und das JSON-LD-Bild serverseitig. Nach 3 Sekunden wird nichts mehr versteckt, falls das Skript nicht läuft.","files":["extensions/storefront/blocks/localized-media.liquid","extensions/storefront/assets/localized-media.js","extensions/storefront/snippets/cp-localized-image.liquid"],"functions":["unhide","replacementFor"],"rule":"Nur eine Theme-App-Extension pro App. Blöcke UND Snippets teilen sich ein hartes Liquid-Budget von 100 KiB, darum liegt die Logik im Asset (zählt nicht).","unsure":false,"unsureNote":""},{"id":"themeimg","label":"Theme-Bild\npro Sprache","kind":"ui","col":2,"row":4,"desc":"Bilder in Theme-Einstellungen (z. B. Logo, Slideshow) sind bei Shopify übersetzbar wie ein Text: je Sprache und Markt wählt der Händler ein anderes Bild, gespeichert über den normalen Theme-Speicherweg (translationsRegister mit Echo). Anders als bei Produktbildern braucht es dafür kein Metafeld und kein Storefront-Skript.","files":["app/components/localized-images/ThemeImageField.tsx","app/utils/templates-field-factory.ts","app/utils/theme-image-reference.shared.ts","app/actions/templates/templates-update.action.ts"],"functions":["ThemeImageField","isThemeImageReference","isThemeMediaValue","handleUpdateContent"],"rule":"Die KI fasst Bildverweise nie an (isThemeImageReference): eine „Übersetzung“ wäre ein kaputter Verweis mit Echo-Bestätigung. Gemessen: Theme-Bild-Einstellungen sind übersetzbar.","unsure":false,"unsureNote":""},{"id":"webp","label":"WebP-Umwandlung\n(Hintergrund)","kind":"job","col":1,"row":2,"desc":"Ersetzt ein Bild durch eine neue WebP-Datei (neues Medium anlegen, altes löschen) und trägt die Ersatzbilder pro Sprache auf die neue Medien-ID um. Die Route /api/convert-webp bucht das Kontingent und legt die Task-Einträge an; der Hintergrund-Worker erzeugt selbst die Upload-Adresse (stagedUploadsCreate), legt das Medium an (productCreateMedia) und löscht das alte (productDeleteMedia).","files":["app/routes/api.convert-webp.tsx","webp-processor.service.js","localized-media-rekey.js"],"functions":["rekeyLocalizedMediaAfterConversion"],"rule":"Weil die Medien-ID sich ändert, werden die Einträge im Metafeld custom.localized_media auf die neue ID umgeschrieben.","unsure":false,"unsureNote":""}],"edges":[{"from":"gallery","to":"savegal","label":"Speichern-Balken"},{"from":"gallery","to":"del","label":"Löschen (sofort)"},{"from":"gallery","to":"webp","label":"WebP (sofort)"},{"from":"altui","to":"altsave","label":"Speichern-Balken"},{"from":"locui","to":"locsrv","label":"Speichern-Balken"},{"from":"themeimg","to":"shopalt","label":"Übersetzung"},{"from":"savegal","to":"shopmedia","label":"Medien anlegen"},{"from":"savegal","to":"settling","label":"createdMedia","style":"dashed"},{"from":"savegal","to":"db","label":"galleryJson"},{"from":"del","to":"shopmedia","label":"productDeleteMedia"},{"from":"del","to":"savegal","label":"Hauptbild leeren","style":"dashed"},{"from":"altsave","to":"shopalt","label":"Alt + Übersetzung"},{"from":"altsave","to":"db","label":"Alt + Übersetzung"},{"from":"locsrv","to":"metafield","label":"ganze Liste"},{"from":"webp","to":"shopmedia","label":"neues Medium"},{"from":"webp","to":"metafield","label":"Ersatzbilder"},{"from":"shopmedia","to":"db","label":"Webhook-Sync","style":"dashed"},{"from":"shopalt","to":"repair","label":"danach","style":"dashed"},{"from":"repair","to":"db","label":"Spiegel"},{"from":"metafield","to":"storefront","label":"liest live"}]},{"id":"p7","title":"Bulk-Editor","intro":"Der Bulk-Editor ist eine Tabelle über Produkte, Varianten, Sammlungen, Artikel, Seiten, Blogs, Richtlinien, Metaobjekte und Bilder. Gespeichert werden nur die geänderten Zellen (der „Diff“ = nur der Unterschied zur geladenen Version). Es gibt vier Eingänge (kleines Speichern, großes Speichern als Task, KI-Übersetzung fehlender Texte, CSV-Import), aber genau einen Schreibweg: applyBulkDiff. Ein „Task“ ist ein Hintergrund-Auftrag; „Echo“ heißt: Shopify meldet den gespeicherten Wert zurück.","nodes":[{"id":"grid","label":"Tabelle (Grid)","kind":"ui","col":0,"row":1,"desc":"Die Tabelle unter /app/bulk. Der Händler ändert Zellen, fügt Bereiche ein, filtert und wählt Sprache und Markt. Die App merkt sich nur den Unterschied zur geladenen Version (Diff). Bis zu 25 geänderte Zellen werden direkt gespeichert, mehr läuft als Hintergrund-Task. Es gibt kein automatisches Speichern.","files":["app/routes/app.bulk.tsx","app/components/bulk-editor/BulkGrid.tsx","app/services/bulk-editor/columns.shared.ts"],"functions":["BulkGrid","computeDiff","MAX_SYNC_SAVE","estimateCalls"],"rule":"Auswahlspalten (Status, Ja/Nein …) haben ein festes Vokabular. Kategorie und Sammlungen werden nur über ihre Picker geschrieben, nie durch eingefügten Text. Preis/SKU in der Produktzeile nur bei genau einer Variante.","unsure":false,"unsureNote":""},{"id":"load","label":"Zeilen laden &\nCSV-Export","kind":"server","col":1,"row":0,"desc":"Der Loader holt die Zeilen aus dem lokalen Cache (loadBulkRows), mit Seiten, Filtern und Übersetzungen. Der CSV-Export ist eine eigene Route, die dieselbe Ladefunktion durchblättert und alle Spalten des Typs exportiert (die sichtbaren zuerst). Ab Basic nutzbar; zu große Dateien werden mit Warnung geliefert, weil der Import sie nicht mehr annehmen würde.","files":["app/services/bulk-editor/load.server.ts","app/routes/app.bulk.export.tsx","app/services/bulk-editor/csv-export.server.ts"],"functions":["loadBulkRows","buildBulkCsvExport","CSV_EXPORT_MAX_ROWS"],"rule":"Der CSV-Export enthält jede Spalte des Typs, die Zeilenobergrenze entspricht der des Imports. Fremdsprachige Spalten exportieren die geladene Übersetzung der gewählten Sprache und des Marktes.","unsure":false,"unsureNote":""},{"id":"translate","label":"Fehlende Übers.\nergänzen (Seite)","kind":"ui","col":0,"row":3,"desc":"Die Seite /app/bulk/translate listet die Treffer des aktuellen Filters mit Häkchen pro Eintrag und Feld und einer Zielsprachen-Leiste. Der Server ermittelt per Scan, was wirklich fehlt (scanMissingTranslations). Die Auswahl des Browsers (Standard plus Ausnahmen, „alle“ gilt über alle Seiten) wird nur über diesen Scan gelegt. Ein Klick auf Start startet den KI-Task.","files":["app/routes/app.bulk_.translate.tsx","app/services/bulk-editor/missing-translations.server.ts","app/services/bulk-editor/translate-missing.shared.ts"],"functions":["scanMissingTranslations","parseTranslateSelection","isPairSelected"],"rule":"Der Scan ist die einzige Quelle für „was fehlt“. Es werden nur globale Übersetzungen geschrieben, nur leere Werte gefüllt (nichts wird überschrieben), URL-Handles nur auf Wunsch. Alt-Texte werden über die Bildzeilen übersetzt; nur die Hauptbild-Spalte der Produktzeile ist ausgenommen.","unsure":false,"unsureNote":""},{"id":"csvui","label":"CSV-Import\n(Vorschau)","kind":"ui","col":0,"row":4,"desc":"Der Händler lädt eine CSV hoch (ab Pro). Die Vorschau berechnet nur den Diff und schreibt nichts; sie warnt auch vor Tabellenkalkulations-Schäden (z. B. wissenschaftliche Schreibweise, verlorene führende Nullen). Kleine Importe (≤ 25 Zellen) laufen über das normale Speichern; größere schickt der Browser als Datei erneut, und der Server rechnet den Diff selbst neu.","files":["app/routes/app.bulk.import.tsx","app/components/bulk-editor/CsvImportModal.tsx","app/services/bulk-editor/csv-import.server.ts"],"functions":["buildCsvImportPreview","spreadsheetDamage"],"rule":"Der GROSSE Import nimmt die DATEI entgegen, nie einen Diff des Browsers. Maximalgröße 50 MB.","unsure":false,"unsureNote":""},{"id":"sync","label":"Speichern direkt\n(≤ 25 Zellen)","kind":"server","col":1,"row":1,"desc":"Die Route-Action von app.bulk.tsx. Sie prüft den Tarif (ab Basic), baut die Spalten serverseitig, prüft jede Änderung und die Sprachen/Märkte und ruft dann applyBulkDiff direkt auf. Größere Änderungen weist sie ab, weil der Browser sie als Task schickt.","files":["app/routes/app.bulk.tsx"],"functions":["saveBulkEdits","findInvalidLocaleOrMarket","MAX_SYNC_SAVE"],"rule":"Alle vier Eingänge prüfen Tarif, Sprache und Markt selbst, weil die /api/ai-Handler und die Import-Route direkt aufrufbar sind.","unsure":false,"unsureNote":""},{"id":"task","label":"Großes Speichern\n(Task seoBulkMeta)","kind":"job","col":1,"row":2,"desc":"Mehr als 25 Zellen laufen als Hintergrund-Task über /api/ai (ab Basic). Der Task heißt aus historischen Gründen weiter seoBulkMeta, obwohl der Editor nicht mehr im SEO-Bereich liegt. Es ist kein KI-Aufruf. Ein Auftrag wird abgelehnt, wenn er mehr als 500 Zellen oder rund 2000 Shopify-Aufrufe braucht. Pro Shop läuft höchstens ein solcher Task gleichzeitig; das blockiert auch einen parallelen CSV-Import, der denselben Typ nutzt.","files":["app/routes/api-ai-handlers/seo-bulk-meta.handler.ts"],"functions":["handleSeoBulkMeta","MAX_BULK_TASK_ITEMS","MAX_TASK_CALLS"],"rule":"Der Task-Typ seoBulkMeta bleibt bestehen; eine Umbenennung würde laufende Tasks und LONG_RUNNING_TASK_TYPES brechen.","unsure":false,"unsureNote":""},{"id":"ai","label":"KI-Übersetzung\n(Task)","kind":"ai","col":1,"row":3,"desc":"Der Task bulkEditorTranslate (ab Pro) scannt die fehlenden Übersetzungen erneut, legt die Auswahl des Händlers darüber und lässt die KI nur diese Werte übersetzen. Das Ergebnis geht als normaler Diff durch applyBulkDiff, es gibt also keinen eigenen Schreibweg. Startet keine Re-Übersetzungen, weil er nur Übersetzungen schreibt.","files":["app/routes/api-ai-handlers/bulk-editor-translate.handler.ts"],"functions":["handleBulkEditorTranslate","buildJobs","translateBatchValuesToLocales"],"rule":"Nichts an der Auswahl wird blind geglaubt: der Kandidatensatz wird serverseitig neu berechnet.","unsure":false,"unsureNote":""},{"id":"csv","label":"CSV-Import\n(Task)","kind":"job","col":1,"row":4,"desc":"Der Apply-Schritt startet EINEN seoBulkMeta-Task, rechnet den Diff aus der Datei neu und zerlegt ihn in Pakete, die jeweils in die zwei Obergrenzen eines Grid-Speicherns passen (eine Zeile wird nie geteilt). Jedes Paket ist ein applyBulkDiff-Aufruf. Ein erneuter Import derselben Datei setzt einen unterbrochenen Lauf fort, weil nur noch Unterschiede übrig sind.","files":["app/services/bulk-editor/csv-import-run.server.ts"],"functions":["startCsvImportTask","runCsvImport","chunkImportDiff","mergeApplyResults"],"rule":"Die Obergrenze für automatische Re-Übersetzungs-Läufe (MAX_REPAIR_GROUPS) gilt einmal für die ganze Datei, nicht pro Paket.","unsure":false,"unsureNote":""},{"id":"validate","label":"Prüfung\n(Server-Spalten)","kind":"server","col":2,"row":2,"desc":"Der Server baut selbst die Liste der erlaubten Spalten je Zeilentyp (nie den Angaben des Browsers glauben). Jede Änderung wird dagegen sowie gegen Tarif-Typen, aktive Sprachen und Märkte geprüft. Zusätzlich normalisiert applyBulkDiff jeden Auswahlwert einmal ganz vorne: gültige Schreibweisen werden vereinheitlicht, ungültige Zellen abgelehnt und mit den erlaubten Werten benannt.","files":["app/services/bulk-editor/columns.server.ts","app/services/bulk-editor/columns.shared.ts","app/services/bulk-editor/translations.server.ts"],"functions":["buildServerColumnsByType","isValidBulkDiffEntry","canonicalSelectValue","findInvalidLocaleOrMarket"],"rule":"Ein falscher Auswahlwert würde bei Shopify als Schema-Fehler ohne userErrors scheitern oder, schlimmer, als 'true' gelesen. Ein eingefügtes 'Ja' hätte sonst bei vielen Varianten die Steuer eingeschaltet.","unsure":false,"unsureNote":""},{"id":"apply","label":"applyBulkDiff\n(ein Schreibweg)","kind":"server","col":3,"row":2,"desc":"Der einzige Schreibweg. Er gruppiert den Diff nach Zeile und Ziel (bei Produkten: Basisfelder, Metafelder, Optionen, Hauptbild-Alt-Text, Preis/Vergleichspreis/SKU der einen Variante) und schreibt in fester Reihenfolge nach Shopify und in den lokalen Cache. Fehler gelten pro Zelle, nie alles-oder-nichts pro Zeile. Zum Schluss werden die gesammelten Re-Übersetzungen einmal gestartet. Nebenwirkungen: Handle-Änderung → Weiterleitung; Sichtbarkeit geändert → IndexNow-Meldung.","files":["app/services/bulk-editor/apply.server.ts"],"functions":["applyBulkDiff","persistRow","persistProductBaseFields","persistTranslationRow","persistSubResourceTranslations"],"rule":"Nur dieser Weg schreibt; neue Schreibwege dürfen nicht daneben entstehen. Ein Ausfall einer Zielgruppe bricht die anderen Gruppen der Zeile nicht ab.","unsure":false,"unsureNote":""},{"id":"db","label":"Datenbank-Cache","kind":"db","col":4,"row":1,"desc":"Nach erfolgreichem Schreiben wird der lokale Cache aktualisiert (Produkte, Sammlungen, Seiten usw.) und die Übersetzungen werden in ContentTranslation bzw. die Alt-Text-Tabellen gespiegelt. Wo Shopify einen Wert zurückmeldet (Echo), wird dieser gespiegelt, nicht der gesendete.","files":["prisma/schema.prisma","app/services/bulk-editor/apply.server.ts"],"functions":["ContentTranslation","ProductImageAltTranslation"],"rule":"Übersetzungen gehen zu Shopify UND in die lokale Datenbank. Die DB-Zeile wird auch geschrieben, wenn Shopify keinen Digest (Prüfsumme des Originaltexts, die Shopify für das Registrieren verlangt) liefert.","unsure":false,"unsureNote":""},{"id":"shopify","label":"Shopify (geprüft\nschreiben)","kind":"shopify","col":4,"row":2,"desc":"Inhalte gehen per productUpdate, collectionUpdate, articleUpdate, pageUpdate, blogUpdate, shopPolicyUpdate, metafieldsSet, productOptionUpdate, productUpdateMedia/fileUpdate, metaobjectUpdate usw. Der Varianten-Block schreibt productVariantsBulkUpdate (eine Anfrage je Produkt) und inventoryItemUpdate (eine je Variante). Fremdsprachige Werte werden nur über die geprüften Funktionen registerAndVerify, removeAndVerify und removeAndVerifyAcrossLocales geschrieben. Erfolg zählt nur, wenn Shopify die Schlüssel als gespeichert zurückmeldet.","files":["app/services/translations/verified-translations.server.ts","app/services/bulk-editor/apply.server.ts"],"functions":["registerAndVerify","removeAndVerify","removeAndVerifyAcrossLocales"],"rule":"Ein leeres userErrors reicht nicht als Beleg. Ein nicht bestätigtes Löschen darf die lokale Zeile nicht löschen (stilles Nichts-Tun von Shopify).","unsure":false,"unsureNote":""},{"id":"repair","label":"Re-Übersetzung\n(Reparatur-Gruppen)","kind":"job","col":4,"row":3,"desc":"Ändert sich ein Haupttext, sind die Übersetzungen veraltet. Bei eingeschaltetem Auto-Übersetzen sammelt applyBulkDiff je Zeile und Bereich EINE Gruppe und startet am Ende je Gruppe einen Hintergrund-Lauf (KI); ohne Auto-Übersetzen entscheidet die gespeicherte Lösch-Einstellung, ob Übersetzungen gelöscht werden. Pro Speichern sind höchstens 25 Gruppen erlaubt; der Rest fällt auf die gespeicherte Lösch-Einstellung zurück und wird gemeldet. Was der Händler im selben Speichern selbst eingetippt hat, wird nicht überschrieben.","files":["app/services/bulk-editor/retranslate.server.ts"],"functions":["collectBulkRepair","flushBulkRepairs","recordBulkForeignWrite","MAX_REPAIR_GROUPS"],"rule":"Pro Gruppe, nicht pro Zelle; Gruppen, deren Übersetzungen sonst gelöscht würden, verdrängen harmlose. Das Starten darf das Speichern nie scheitern lassen, denn alle Zeilen sind schon geschrieben.","unsure":false,"unsureNote":""},{"id":"watch","label":"Task-Beobachtung\n(Grid lädt neu)","kind":"ui","col":3,"row":1,"desc":"Das Speichern liefert die Task-IDs der Hintergrundläufe in der Antwort zurück (beim großen Speichern im Ergebnis des seoBulkMeta-Tasks). Danach fragt der Browser /api/task-status ab und lädt das Grid neu, sobald ein Lauf fertig ist, damit die Zelle nicht leer bleibt, obwohl die Übersetzung schon kommt. Es wird nur gelesen und neu geladen, nie gespeichert.","files":["app/hooks/useBackgroundTaskRefresh.ts","app/routes/api.task-status.tsx"],"functions":["useBackgroundTaskRefresh","othersAlive","repairTaskIdsOf"],"rule":"Nur ein Endstatus beendet eine ID. Eine Antwort ohne Ergebnis zählt nicht als 'fertig'. Die Frist wird erneuert, solange ein Lauf sichtbar lebt. Die Beobachtung endet von selbst.","unsure":false,"unsureNote":""}],"edges":[{"from":"grid","to":"load","label":"Zeilen / Export"},{"from":"grid","to":"sync","label":"≤ 25 Zellen"},{"from":"grid","to":"task","label":"> 25 Zellen"},{"from":"translate","to":"ai","label":"Auswahl + Start"},{"from":"csvui","to":"csv","label":"Datei anwenden"},{"from":"csvui","to":"sync","label":"≤ 25 Zellen","style":"dashed"},{"from":"sync","to":"validate","label":"Diff"},{"from":"task","to":"validate","label":"Diff"},{"from":"ai","to":"validate","label":"Übersetzungs-Diff"},{"from":"csv","to":"validate","label":"Pakete"},{"from":"validate","to":"apply","label":"geprüfter Diff"},{"from":"apply","to":"shopify","label":"Schreiben + Echo"},{"from":"apply","to":"db","label":"Cache / Spiegel"},{"from":"apply","to":"repair","label":"gesammelte Gruppen","style":"dashed"},{"from":"repair","to":"shopify","label":"neue Übersetzung"},{"from":"apply","to":"watch","label":"Task-IDs in Antwort","style":"dashed"},{"from":"watch","to":"grid","label":"neu laden"}]},{"id":"p8","title":"Synchronisation","intro":"Die App spiegelt Shopify-Inhalte (Produkte, Sammlungen, Seiten, Artikel, Übersetzungen …) in die eigene Datenbank. Das passiert beim ersten Start komplett, danach laufend im Hintergrund, bei Änderungen über Webhooks und auf Knopfdruck für einzelne Einträge. Schutzmechanismen sorgen dafür, dass ein Sync nie frisch gespeicherte Übersetzungen überschreibt oder wegen eines Lesefehlers löscht.","nodes":[{"id":"trigger","label":"Shop wird aktiv\n(Install / Seitenaufruf)","kind":"ui","col":0,"row":0,"desc":"Bei jedem App-Aufruf eines Händlers (und bei Installation und Tarif-Upgrade) startet die App den Sync-Timer für diesen Shop; läuft er schon, wird er sauber neu gestartet. Der Knopf „Neu synchronisieren“ in den Einstellungen fordert einen kompletten Neu-Sync an (alles löschen und neu holen) und startet den Timer neu.","files":["app/routes/app.products.tsx","app/routes/api.sync-trigger.tsx","app/shopify.server.ts","app/services/billing.server.ts"],"functions":["startSyncForShop"],"rule":"","unsure":false,"unsureNote":""},{"id":"scheduler","label":"Sync-Scheduler","kind":"job","col":1,"row":0,"desc":"Pro Shop läuft ein Timer (Standard alle 60 Sekunden, per Umgebungsvariable änderbar, mit zufälligem Startversatz). Je Zyklus entscheidet er: Ist die erste Komplett-Synchronisation noch nicht abgeschlossen, läuft die; sonst der leichte Hintergrund-Sync. Ein Shop ohne Aktivität seit 5 Minuten wird gestoppt.","files":["app/services/sync-scheduler.service.ts"],"functions":["runSyncCycle","stopSyncForShop","startSyncForShop"],"rule":"Die Weiche ist der Marker initialSyncCompletedAt in ShopInstallState. Während der Erst-Sync wird die Inaktivitäts-Sperre übergangen (max. 3 Stunden). Nur eine begrenzte Zahl Shops synchronisiert gleichzeitig, damit der Server nicht überlastet wird (SYNC_MAX_CONCURRENCY).","unsure":false,"unsureNote":""},{"id":"initial","label":"Erst-Komplett-Sync","kind":"job","col":2,"row":0,"desc":"Der Orchestrator holt nacheinander alles, je nach Tarif: Produkte, Sammlungen, Artikel, Seiten, Richtlinien, Themes, Systeminhalte, Lieferinhalte, Online-Store-Extras, Cookie-Banner, Abo-Pläne, Metaobjekte und Menüs. Fortschritt wird pro Bereich gemeldet. Schlägt ein Bereich fehl, wird der Erst-Sync nicht als fertig markiert und im nächsten Zyklus wiederholt. Ein Neu-Sync kann über requestInitialResync angefordert werden.","files":["app/services/initial-sync.service.ts","app/services/sync-phases.shared.ts"],"functions":["runInitialFullSync","requestInitialResync"],"rule":"Nur die syncAll*-Läufe und der Erst-Sync entdecken neu angelegte Shopify-Ressourcen. Sie schalten die Übersetzungs-Abgleiche (reconcileTranslations) bewusst NICHT ein. Der Produkt-Sync legt dabei Basis-Fingerabdrücke des Quelltextes an (nur anlegen, nie überschreiben).","unsure":false,"unsureNote":""},{"id":"incremental","label":"Hintergrund-Sync\n(laufend)","kind":"job","col":2,"row":1,"desc":"Nach dem Erst-Sync hält der BackgroundSyncService parallel Seiten, Artikel, Menüs, Richtlinien, Themes, Metaobjekte, System-/Lieferinhalte, Cookie-Banner usw. aktuell (je nach Tarif). Produkte und Sammlungen sind nicht dabei – dafür sind Webhooks und der Drift-Abgleich zuständig.","files":["app/services/background-sync.service.ts"],"functions":["syncAll","syncAllPages","syncAllPolicies","syncAllThemes"],"rule":"Diese Läufe aktualisieren nur den Cache und lösen keinen Übersetzungs-Abgleich aus; geänderte Seiten/Artikel/Blogs/Richtlinien findet die tägliche Drift-Prüfung. (Sie haben bei Shopify keinen Webhook.)","unsure":false,"unsureNote":""},{"id":"reconcile","label":"Drift-Abgleich\nProdukte/Sammlungen","kind":"job","col":2,"row":2,"desc":"Als Sicherheitsnetz für verpasste Webhooks listet dieser Abgleich nur ID und Änderungsdatum aus Shopify, vergleicht mit dem lokalen Cache und lädt nur die abweichenden Einträge neu. Der Scheduler ruft ihn nur alle 30 Zyklen und nur für aktive Shops auf. Gelöscht wird nur, wenn die Shopify-Liste nachweislich vollständig ist. Fehlt ein Eintrag lokal, wird er neu angelegt (ohne Übersetzungs-Abgleich); nur bereits bekannte Einträge werden mit Abgleich neu geladen.","files":["app/services/webhook-reconcile.service.ts","app/services/sync-scheduler.service.ts"],"functions":["reconcileWebhookBackedTypes","listRefs"],"rule":"Der Abgleich nutzt dieselben Einzel-Eintrags-Wege wie die Webhooks, keinen eigenen Sync-Pfad. Eine leere Antwort von Shopify gilt als Ausfall und löscht nichts.","unsure":false,"unsureNote":""},{"id":"hook","label":"Shopify-Webhooks\nproducts/collections","kind":"shopify","col":0,"row":4,"desc":"Shopify meldet Anlegen, Ändern und Löschen von Produkten und Sammlungen. Welche Ereignisse die App bekommt, steht in der App-Konfiguration (shopify.app.*.toml). Beim Löschen entfernt die App den Cache-Eintrag.","files":["shopify.app.prod.toml","shopify.app.dev.toml","app/services/webhook-registration.service.ts"],"functions":["registerAllWebhooks","registerProductWebhooks","registerSubscriptionWebhooks"],"rule":"Der Plattform-Adapter in server.js muss der Web-API-Adapter sein und vor Sentry.init importiert werden, sonst antwortet jeder Webhook mit 400 (in Produktion war das drei Monate lang so).","unsure":false,"unsureNote":""},{"id":"whroute","label":"Webhook-Routen","kind":"server","col":1,"row":4,"desc":"Die Routen prüfen die Signatur, protokollieren das Ereignis (WebhookLog) und verarbeiten es danach asynchron. Bei PRODUCTS_UPDATE wird mit Übersetzungs-Abgleich neu geladen, bei CREATE nicht (das ist ein erster Sync). Zusätzlich wird IndexNow benachrichtigt, wenn eine Produkt-/Sammlungs-URL live geht oder verschwindet (nur wenn IndexNow aktiv).","files":["app/routes/webhooks.products.tsx","app/routes/webhooks.collections.tsx"],"functions":["processWebhookAsync","action"],"rule":"Nur Änderungs-Ereignisse (UPDATE) schalten reconcileTranslations ein, nie CREATE.","unsure":false,"unsureNote":""},{"id":"retry","label":"Webhook-Wiederholung","kind":"job","col":1,"row":3,"desc":"Schlägt die Verarbeitung fehl, wird sie mit steigender Wartezeit wiederholt (1 s → 2 s → 4 s → 8 s → 16 s, höchstens 60 s, maximal 5 Versuche). Erfolgreiche und abgelaufene Einträge werden aufgeräumt. Es gibt einen eingebauten Standard-Handler.","files":["app/services/webhook-retry.service.ts","app/config/constants.ts"],"functions":["scheduleRetry","defaultHandler","cleanup"],"rule":"Ein Retry wiederholt dasselbe Ereignis: Änderung mit Übersetzungs-Abgleich, Anlegen ohne, Löschen löscht.","unsure":false,"unsureNote":""},{"id":"single","label":"Einzel-Neuladen\n(Reload)","kind":"server","col":2,"row":3,"desc":"Der Button „neu laden“ im Editor lädt genau einen Eintrag frisch von Shopify (Produkt, Sammlung, Seite, Artikel, Blog, Richtlinie). Dabei wird auch geprüft, ob sich Übersetzungen veraltet haben. Die Route lädt auch Theme-Gruppen und Metaobjekt-Typen neu; Produkte laufen über eine eigene Route mit Übersetzungs-Abgleich.","files":["app/routes/api.sync-single-product.tsx","app/routes/api.sync-single-resource.tsx","app/services/product-sync.service.ts","app/services/content-sync.service.ts","app/services/background-sync.service.ts"],"functions":["syncSingleProduct","syncSingleCollection","syncSinglePage","syncSinglePolicy","syncProduct"],"rule":"Reload aktualisiert nur bereits bekannte IDs. Neu in Shopify angelegte Ressourcen erscheinen erst bei einem vollen syncAll*-Lauf.","unsure":false,"unsureNote":""},{"id":"syncsvc","label":"Sync-Dienste\nProdukt / Inhalt","kind":"server","col":3,"row":2,"desc":"ProductSyncService und ContentSyncService fragen Shopify bei Shopify (GraphQL = Abfragesprache der Shopify-Schnittstelle) ab (Seitengrößen sind auf Kosten-Limits abgestimmt) und schreiben Produkte, Varianten, Bilder, Sammlungen, Artikel und deren Übersetzungen in die Datenbank. Danach läuft optional der Abgleich veralteter Übersetzungen.","files":["app/services/product-sync.service.ts","app/services/content-sync.service.ts","app/services/shopify-api-gateway.service.ts"],"functions":["syncAllProducts","syncAllCollections","syncAllArticles","syncAllMenus"],"rule":"Varianten werden aktualisiert bzw. neu angelegt (nie gelöscht und neu erstellt); sonst gehen Galerie-Daten verloren). Es gibt mehrere Produkt-Schreibwege (auch zwei route-lokale), neue Produktspalten müssen in alle.","unsure":false,"unsureNote":""},{"id":"fetch","label":"Übersetzungen lesen\n(+ Fehler-Schutz)","kind":"server","col":4,"row":1,"desc":"fetchAllTranslations liest pro Sprache (und Markt) alle Übersetzungen eines Eintrags. Scheitert das Lesen einer Sprache, wird sie als „fehlgeschlagen“ gemerkt. translationWriteScope bestimmt dann, welche lokalen Zeilen überhaupt gelöscht/ersetzt werden dürfen.","files":["app/services/sync-utils.ts"],"functions":["fetchAllTranslations","translationWriteScope","marketLayersForLocale","fetchShopLocales"],"rule":"Ein fehlgeschlagenes Lesen ist kein Löschen: Zeilen einer nicht lesbaren Sprache oder eines Marktes bleiben erhalten. Nicht veröffentlichte Sprachen werden wie veröffentlichte gelesen.","unsure":false,"unsureNote":""},{"id":"shield","label":"Sync-Schutz\n(Locks)","kind":"server","col":4,"row":2,"desc":"Wer gerade Übersetzungen speichert, markiert die Ressource (nur im Arbeitsspeicher des Servers, ca. 30 Sekunden). Ein Sync oder Webhook, der kurz danach kommt, aktualisiert die Hauptfelder, überspringt aber das Neuschreiben der Übersetzungen, weil Shopify sonst noch alte Werte liefern könnte. Für Teilbereiche (Alt-Texte, Optionen, Titelbild-Alt) gibt es eigene, feinere Sperr-Schlüssel.","files":["app/utils/translation-save-lock.server.ts","app/services/translations/translation-locks.shared.ts"],"functions":["markTranslationSaved","isTranslationRecentlySaved","translationSavedAt","altTextLockId","altTextSyncShieldId","subResourceLockId","featuredAltLockId","marketLayerLockId"],"rule":"Jeder Schreibweg, der eine Übersetzung speichert, muss denselben Schlüssel markieren, sonst überschreibt eine Reparatur den gerade gespeicherten Wert. Ein Markt-Schreibzugriff nutzt marketLayerLockId.","unsure":false,"unsureNote":""},{"id":"db","label":"Cache-Tabellen\n(Prisma/Postgres)","kind":"db","col":4,"row":3,"desc":"Die lokale Kopie: unter anderem Product, ProductVariant, ProductImage, Collection, Article, Page, ContentTranslation, ThemeTranslation, PrimaryDigestBaseline sowie ShopInstallState, WebhookLog und WebhookRetry für den Sync-Betrieb selbst. Alle Zeilen sind pro Shop getrennt.","files":["prisma/schema.prisma"],"functions":[],"rule":"Merchandising-Attribute sind nur lesbar, wenn attributesSyncedAt gesetzt ist; sonst sind die Spalten nur Migrations-Standardwerte und bedeuten „unbekannt“.","unsure":false,"unsureNote":""}],"edges":[{"from":"trigger","to":"scheduler","label":"startet Timer"},{"from":"scheduler","to":"initial","label":"Marker leer"},{"from":"scheduler","to":"incremental","label":"Marker gesetzt"},{"from":"scheduler","to":"reconcile","label":"alle 30 Zyklen","style":"dashed"},{"from":"hook","to":"whroute","label":"Ereignis"},{"from":"whroute","to":"retry","label":"bei Fehler","style":"dashed"},{"from":"initial","to":"syncsvc","label":"syncAll*"},{"from":"incremental","to":"syncsvc","label":""},{"from":"single","to":"syncsvc","label":"syncProduct"},{"from":"syncsvc","to":"fetch","label":"Übersetzungen"},{"from":"syncsvc","to":"shield","label":"prüft Lock"},{"from":"syncsvc","to":"db","label":"schreibt Cache"},{"from":"reconcile","to":"syncsvc","label":"nur Abweichungen"},{"from":"whroute","to":"syncsvc","label":"UPDATE mit Abgleich"},{"from":"retry","to":"syncsvc","label":"erneut","style":"dashed"}]},{"id":"p9","title":"SEO-Bereich (grob)","intro":"Der SEO-Bereich misst, wie die Storefront wirklich ausgeliefert wird (Crawl, jeder Lauf wird als Snapshot = Momentaufnahme gespeichert), prüft strukturierte Daten, erzeugt KI-Entdeckungsdateien (llms.txt, agents.md), meldet Änderungen per IndexNow und kümmert sich um Weiterleitungen. Die Storefront-Teile laufen über genau eine Theme-App-Extension. Die App verändert dabei nie den Theme-Code des Händlers, sondern nur eigene Dateien.","nodes":[{"id":"crawlauto","label":"Wöchentlicher Crawl\n(Zeitplan)","kind":"job","col":0,"row":0,"desc":"Ein Zeitgeber prüft stündlich, welche Shops mit passendem Plan und Einwilligung wieder dran sind, und startet pro Durchlauf nur wenige (3) Crawls. Der Rhythmus ist wöchentlich, weil der Crawl die echte Storefront abruft.","files":["app/services/seo/crawl-auto-run.service.ts"],"functions":["SeoCrawlAutoRunService"],"rule":"Wöchentlicher und manueller Crawl starten über denselben Weg (crawl-run.server.ts). Läuft für einen Shop schon ein Crawl, wird er übersprungen und nie doppelt gestartet.","unsure":false,"unsureNote":""},{"id":"crawlrun","label":"Crawl starten\n(ein Weg)","kind":"server","col":1,"row":0,"desc":"startCrawlRun kümmert sich um Einzellauf-Schutz, Task-Eintrag, Snapshot-Aufbewahrung und Fehlerbuchführung. Die Seite /app/seo/crawl ist nur die HTTP-Hülle darüber. Ein hängender Lauf nach einem Neustart wird erkannt und übernommen.","files":["app/services/seo/crawl-run.server.ts","app/routes/app.seo.crawl.tsx","orphan-run-recovery.js"],"functions":["startCrawlRun","runSeoCrawlTask","fetchCrawlShopContext"],"rule":"Ein losgelöster Lauf darf seinen Einzellauf-Schutz nicht überleben: nach 5 Minuten Stille (Herzschlag) gilt ein Crawl als tot, beim Serverstart sofort. Der Snapshot wird als „unterbrochen“ markiert, nie gelöscht. Wiederaufnahme wurde bewusst verworfen.","unsure":false,"unsureNote":""},{"id":"crawl","label":"Crawler\n(live abrufen)","kind":"server","col":2,"row":0,"desc":"runCrawl ruft die Seiten der echten Storefront ab (Breitensuche bis Tiefe 5, max. 2000 Seiten, Sperrliste für Warenkorb/Konto) und liest Titel, Meta, Canonical (die Haupt-URL einer Seite), Robots, JSON-LD und Open-Graph aus. Nach dem Speichern folgt, abschaltbar, ein zweiter Durchgang für externe Links (403/429 gilt als Bot-Schutz, nicht als toter Link).","files":["app/services/seo/crawl.service.ts","app/services/seo/external-links.server.ts","app/services/seo/locale-path.shared.ts"],"functions":["runCrawl","stripLocalePrefix"],"rule":"Jede Pfadregel muss auch mit Sprach-Präfix funktionieren (/it/cart darf nicht gecrawlt werden). Eine leere Crawl-Spalte ist nie ein Beweis, sondern heißt „unbekannt“. Seiten werden erst am Ende in einem Block gespeichert.","unsure":false,"unsureNote":""},{"id":"snapshot","label":"Crawl-Snapshots\n(DB)","kind":"db","col":3,"row":0,"desc":"Jeder Lauf wird als Momentaufnahme gespeichert (SeoCrawlSnapshot mit SeoCrawlPage, kaputten Links, externen Links). Beide Berichte lesen immer denselben neuesten Snapshot. Zwei Snapshots lassen sich als zwei Zeitpunkte vergleichen.","files":["app/services/seo/crawl-snapshot.server.ts","app/services/seo/crawl-markup-rows.server.ts","prisma/schema.prisma"],"functions":["loadLatestSnapshot","loadExpectedNoindexReasons","loadCrawlMarkupPages"],"rule":"Absichtliches noindex (angewandte Sitemap-Ausschlüsse, unlistete Produkte) wird erkannt und nicht als Fehler gemeldet.","unsure":false,"unsureNote":""},{"id":"onpage","label":"Crawl-Berichte\n(Schritt 1 + 2)","kind":"server","col":4,"row":0,"desc":"Der Crawl-Tab hat zwei Schritte, die denselben Snapshot lesen: Schritt 1 „Auslieferung“ (Statuscodes, Weiterleitungen, noindex) und Schritt 2 „On-Page“. Daraus entstehen Listen wie fehlende Meta-Beschreibungen, Duplikate, Canonical-Probleme, dünne Inhalte oder Bilder ohne Alt-Text. Jede Kategorie wird gegen bekannte Fehlalarme gefiltert. Eine CSV-Ausgabe gibt es ebenfalls.","files":["app/services/seo/onpage-report.server.ts","app/services/seo/onpage.service.ts","app/services/seo/csv-export.ts"],"functions":["buildOnPageReport","hasEditableMetadata"],"rule":"Seiten ohne Metadaten-Oberfläche (Richtlinien, /collections/all, ?page=N) sind kein Befund; die Zahl der ausgeschlossenen wird angezeigt. Die kanonische Adresse (Haupt-URL einer Seite) kommt aus den gecrawlten URLs, nicht aus einer Abfrage.","unsure":false,"unsureNote":""},{"id":"gate","label":"Aktivierungs-Schranke\nStrukturierte Daten","kind":"server","col":3,"row":1,"desc":"Bevor ein Händler einen Markup-Schalter (JSON-LD, Social-Tags) einschaltet, bewertet activationGate (die „Schranke“) anhand der Momentaufnahme des Crawls, ob dadurch doppeltes Markup entstünde. Ohne Messung gibt es nie grünes Licht. Das Ergebnis erscheint auf der Seite Strukturierte Daten.","files":["app/services/seo/markup-activation.shared.ts","app/routes/app.seo.structured-data.tsx","app/services/seo/json-ld-audit.service.ts"],"functions":["activationGate","embedBadgeVerdict","worstActivationVerdict"],"rule":"Aktivierung ist der letzte Schritt, nie der erste. Eine fehlende Messung ist kein Freifahrtschein; Markup ohne unsere Markierung gilt per Entscheidung als fremd (Theme oder andere App). Die Datei ist importfrei, sonst bricht der Client-Build.","unsure":false,"unsureNote":""},{"id":"block","label":"Theme-Extension\nBlöcke","kind":"storefront","col":4,"row":1,"desc":"Die eine Theme-App-Extension enthält JSON-LD (structured-data), Social-Meta, Web-Vitals und weitere Blöcke. Händler schalten sie als App-Embeds an. Blöcke UND Snippets zusammen dürfen 100 KiB Liquid nicht überschreiten, deshalb wird mit npm run deploy minifiziert.","files":["extensions/storefront/blocks/structured-data.liquid","extensions/storefront/blocks/social-meta.liquid","extensions/storefront/blocks/web-vitals.liquid","extensions/storefront/shopify.extension.toml","scripts/deploy-minified.mjs"],"functions":[],"rule":"Pro Shopify-App nur EINE Theme-Extension. Die App ändert nie den Theme-Code des Händlers, nur eigene Dateien.","unsure":false,"unsureNote":""},{"id":"aeo","label":"KI-Entdeckung\nllms.txt / agents.md","kind":"server","col":0,"row":2,"desc":"Aus Shop-Daten (Richtlinien, Katalog) erzeugt die App zwei Dateien für KI-Assistenten. Der Einleitungsabsatz gehört dem Händler, der Rest wird generiert. Eine Messung prüft, was die Live-URL wirklich ausliefert. Ein Zeitgeber erneuert veraltete Dateien automatisch (abschaltbar).","files":["app/services/seo/aeo.service.ts","app/services/seo/llms-auto-refresh.service.ts","app/services/seo/ai-discovery-intro.shared.ts"],"functions":["generateAndUpsertAiDiscovery","buildAiDiscoveryForShop","refreshLlmsTxtIfStale","probeAiDiscoveryDelivery","buildAgentsMd","buildLlmsTxt"],"rule":"agents.md ist die maßgebliche Datei, llms.txt spiegelt sie; beide werden immer zusammen geschrieben. llms-full.txt wird bewusst nicht überschrieben. Schreiben nur hinter dem Schalter AEO_THEME_WRITES.","unsure":false,"unsureNote":""},{"id":"aeofiles","label":"Theme-Dateien\nllms/agents","kind":"storefront","col":1,"row":2,"desc":"Die Dateien landen als templates/llms.txt.liquid und templates/agents.md.liquid im Theme. Sie sind app-eigen, die App kann sie wieder entfernen („Unsere Version entfernen“), dann liefert wieder Shopify den Standard aus. Dasselbe Prinzip gilt für die app-eigene Vorlage templates/robots.txt.liquid.","files":["app/services/seo/aeo.service.ts"],"functions":["defangLiquid","LLMS_TEMPLATE_FILENAME","AGENTS_TEMPLATE_FILENAME"],"rule":"Gespeichert heißt nicht ausgeliefert: die UI unterscheidet fünf Zustände (aktuell/veraltet/gespeichert aber nicht ausgeliefert/Shopify-Standard/nicht erreichbar).","unsure":false,"unsureNote":""},{"id":"indexnow","label":"IndexNow","kind":"server","col":2,"row":2,"desc":"Meldet geänderte oder entfernte URLs an Suchmaschinen. Eingereiht wird von Produkt-/Sammlungs-Webhooks, beim Speichern im Editor (Seiten, Artikel und Blogs haben keinen Webhook) und vom Bulk-Editor (Sichtbarkeit). Ein Zeitgeber (alle 15 Min., ab Pro) sendet wartende URLs gesammelt.","files":["app/services/seo/index-now.service.ts","app/services/seo/index-now-content.server.ts","app/services/seo/index-now-auto-submit.service.ts"],"functions":["shouldEnqueuePublishChange","enqueuePublishChange","submitUrls","submitAll","enqueueResource"],"rule":"Es wird die primäre Domain gemeldet, nie *.myshopify.com. Eingereiht wird beim Übergang (live oder gerade 404), nie für nie veröffentlichte Entwürfe.","unsure":false,"unsureNote":""},{"id":"keyfile","label":"Schlüsseldatei\n+ Weiterleitung","kind":"server","col":3,"row":2,"desc":"IndexNow verlangt eine Schlüsseldatei im Root der Storefront. Die App legt dafür eine Shopify-URL-Weiterleitung von /<key>.txt auf den App-Proxy an (eine Storefront-Adresse, die Shopify an die App weiterreicht), der den Schlüssel ausliefert. Die Weiterleitungs-ID wird gespeichert und bei Bedarf neu angelegt.","files":["app/services/seo/index-now-key-file.server.ts","app/routes/proxy.indexnow-key.tsx","app/routes/api.indexnow-probe.tsx","app/services/seo/index-now.service.ts"],"functions":["ensureKeyRedirect","removeKeyRedirect","keyFilePath","keyLocationFor"],"rule":"Der Schlüssel muss im Root liegen (Scope-Regel, gemessen: ein Pfad im App-Proxy führt zu 422). Alles bleibt auf einem Host: 301 auf denselben Host, dann App-Proxy.","unsure":false,"unsureNote":""},{"id":"redirects","label":"Handle-Weiterleitungen\n& Ketten","kind":"server","col":3,"row":3,"desc":"Ändert sich ein Handle (URL-Name), legt die App für die alte URL eine Weiterleitung an. Ausgelöst wird das beim Speichern im Editor (auch bei Produkten), im Bulk-Editor und bei der Handle-Neuübersetzung. Sie vergleicht mit bestehenden Weiterleitungen, statt blind neue zu erzeugen. Zusätzlich erkennt redirect-chains.ts Ketten A→B→C aus der Shopify-Liste, ohne Crawl.","files":["app/services/seo/handle-redirect.server.ts","app/services/seo/handle-redirect.shared.ts","app/services/seo/redirect-chains.ts"],"functions":["applyHandleRedirect","decideHandleRedirect","applyTranslatedHandleRedirect","findRedirectChains"],"rule":"Maßgeblich ist das Handle, das Shopify zurückgibt, nicht das gesendete. Die Weiterleitung darf nie das Speichern scheitern lassen. Übersetzte Handles werden mit EINER unpräfixierten Zeile abgedeckt.","unsure":false,"unsureNote":""},{"id":"shopredir","label":"Shopify\nURL-Weiterleitungen","kind":"shopify","col":4,"row":3,"desc":"Die Weiterleitungs-Tabelle des Shops in Shopify. Hier landen sowohl die Handle-Weiterleitungen als auch die Schlüssel-Weiterleitung für IndexNow.","files":["app/services/seo/redirects.service.ts"],"functions":["listRedirects","createRedirect"],"rule":"","unsure":false,"unsureNote":""},{"id":"indexsrc","label":"Auslöser für IndexNow\n(Webhooks, Editor)","kind":"server","col":2,"row":1,"desc":"Drei Stellen reihen geänderte URLs für IndexNow ein: die Produkt- und Sammlungs-Webhooks, das Speichern im Editor (Seiten, Artikel, Blogs) und der Bulk-Editor, wenn dort die Sichtbarkeit geändert wird. Eingereiht wird nur beim Übergang (live oder gerade 404).","files":["app/routes/webhooks.products.tsx","app/actions/content/content-update.action.ts","app/services/seo/index-now-content.server.ts"],"functions":["enqueueResource","enqueuePublishChange","shouldEnqueueProductChange"],"rule":"Seiten, Artikel und Blogs haben keinen Shopify-Webhook, darum ist das Speichern der einzige Moment, in dem die App von einer Änderung weiß.","unsure":false,"unsureNote":""},{"id":"redirpage","label":"Seite Weiterleitungen\n& 404-Protokoll","kind":"ui","col":3,"row":4,"desc":"Die Seite Weiterleitungen zeigt Ketten, Händler-Weiterleitungen und ein 404-Protokoll aus der Storefront. Die 404-Treffer meldet die Storefront über den App-Proxy an die App. Händler können hier selbst Weiterleitungen anlegen.","files":["app/routes/app.seo.redirects.tsx","app/routes/proxy.seo-404.tsx","app/services/seo/redirects.service.ts"],"functions":["record404Hit","listRedirects","createRedirect"],"rule":"","unsure":false,"unsureNote":""}],"edges":[{"from":"crawlauto","to":"crawlrun","label":"startet","style":"dashed"},{"from":"crawlrun","to":"crawl","label":"Task im Hintergrund"},{"from":"crawl","to":"snapshot","label":"speichert"},{"from":"snapshot","to":"onpage","label":"liest"},{"from":"snapshot","to":"gate","label":"Markup-Messung"},{"from":"gate","to":"block","label":"darf einschalten?"},{"from":"aeo","to":"aeofiles","label":"schreibt"},{"from":"indexnow","to":"keyfile","label":"Schlüssel"},{"from":"keyfile","to":"shopredir","label":"Weiterleitung"},{"from":"redirects","to":"shopredir","label":"alte URL → neue"},{"from":"indexsrc","to":"indexnow","label":"einreihen"},{"from":"redirpage","to":"shopredir","label":"Händler-Regeln"}]},{"id":"p10","title":"Einstellungen, Pläne & Gates","intro":"Die Einstellungsseite bündelt Sprachen & Märkte, KI-Anweisungen und den Plan-Tab. Pläne (Free, Basic, Pro, Max) laufen über die Shopify-Abrechnung und werden in AISettings gespiegelt. Jede Funktion, die einen Mindestplan braucht, prüft das auf dem Server, weil Routen direkt per POST erreichbar sind. Die Oberfläche zeigt dieselbe Entscheidung nur ehrlich an.","nodes":[{"id":"settings","label":"Einstellungsseite","kind":"ui","col":0,"row":0,"desc":"/app/settings hat Reiter (App-Setup, KI-API-Zugangscodes, KI-Anweisungen, Sprachen und Märkte, SEO, Weiteres, Plan). Übersetzungs-Einstellungen liegen unter KI-Anweisungen. Alle Aktionen laufen über eine action-Funktion, die nach actionType verzweigt. Einstellungen sind immer ein Entwurf und werden erst über die Speichern-Leiste übernommen.","files":["app/routes/app.settings.tsx"],"functions":["action","loader"],"rule":"Eine Einstellung wird nie durch den Klick gespeichert, der sie ändert. Es gibt eine native Speichern-Leiste pro Seite, und Ja/Nein-Entscheidungen sind Pill-Schalter (ToggleRow), keine Checkboxen.","unsure":false,"unsureNote":""},{"id":"langtab","label":"Tab Sprachen\nund Märkte","kind":"ui","col":1,"row":0,"desc":"Hier veröffentlicht der Händler Sprachen, fügt neue hinzu, legt fest, in welchen Märkten sie erscheinen, und verwaltet Markt-Adressen. Sprachen-Änderungen sind ein Entwurf hinter der Speichern-Leiste. Entfernen einer Sprache, Löschen eines Marktes und Adressen sind eigene bestätigte Aktionen.","files":["app/components/SettingsShopLanguagesTab.tsx","app/components/ShopMarketAddresses.tsx"],"functions":["SettingsShopLanguagesTab"],"rule":"Sprache entfernen läuft nie als Einstellung, sondern nur mit Tippen des Namens zur Bestätigung (nur wenn kein Entwurf offen ist). Neue Sprachen kommen unveröffentlicht an und werden nur bei eingeschaltetem Schalter veröffentlicht.","unsure":false,"unsureNote":""},{"id":"publish","label":"Sprachen\nveröffentlichen","kind":"server","col":2,"row":0,"desc":"Pro Sprache ein Aufruf an Shopify (veröffentlichen, hinzufügen, entfernen). Erst die zurückgegebene Antwort zählt als bestätigt. Danach werden die Zuordnungen zu Märkten (Web-Präsenzen) gesetzt und per erneutem Lesen geprüft. Nach bestätigtem Entfernen einer Sprache werden die lokalen Übersetzungen dieser Sprache in allen vier Übersetzungs-Tabellen gelöscht, ebenso ihre offenen Einträge in der Wiederholungsliste.","files":["app/services/shop-locale-publish.server.ts"],"functions":["applyLocaleChanges","setShopLocalesPublished","planLocaleChanges","loadMarketWebPresences","setLocaleMarkets","loadAvailableLocales"],"rule":"Primäre und unbekannte Sprachen werden vor dem Senden abgelehnt. Der Markt-Schreibzugriff sendet immer die komplette Menge und liest danach neu; ein unvollständiges Lesen macht das Ergebnis null statt zu raten. Braucht den Scope write_locales (und write_markets).","unsure":false,"unsureNote":""},{"id":"marketaddr","label":"Märkte & Adressen","kind":"server","col":1,"row":1,"desc":"Legt Unterordner-Adressen für Märkte an oder entfernt sie, erstellt Märkte als Entwurf, schaltet sie an/aus und löscht sie. Zeigt zu jedem Markt die Basiswährung und einen Link in die Shopify-Marktverwaltung.","files":["app/services/market-address.server.ts"],"functions":["loadMarketAddresses","createMarketSubfolder","removeMarketAddress","createMarket","setMarketStatus","deleteMarket","marketAdminGraphUrl"],"rule":"Neue Märkte starten immer als Entwurf. Primärmarkt bekommt weder Adresse noch Löschen. Eine Adresse, die andere Märkte mitnutzen, wird nicht entfernt. Währung ändern ist bewusst nicht gebaut.","unsure":false,"unsureNote":""},{"id":"shopifylm","label":"Shopify\nSprachen & Märkte","kind":"shopify","col":3,"row":0,"desc":"Die Sprachen (shopLocale) und Märkte samt Web-Präsenzen im Shop. Der Einstellungs-Reiter liest sie über shop-locale-publish; die Frage, ob der Shop mehrsprachig ist, beantwortet ein zwischengespeicherter Lesezugriff (getCachedShopLocales).","files":["app/utils/shop-locales-cache.server.ts","app/services/shop-locale-publish.server.ts"],"functions":["getCachedShopLocales","loadMarketWebPresences"],"rule":"Märkte werden über status === ACTIVE gewertet, nicht über das veraltete enabled. Mehrere Märkte teilen oft eine Web-Präsenz.","unsure":false,"unsureNote":""},{"id":"langctx","label":"Ein-Sprachen-Gate\n(Kontext)","kind":"ui","col":4,"row":0,"desc":"Hat ein Shop nur eine Sprache, werden Sprachleisten ganz entfernt und Übersetzungs-Buttons ausgegraut, mit Hinweis im Tooltip. Der Editor stellt dafür einen Kontext bereit, Komponenten lesen ihn mit useSingleLocaleHint.","files":["app/contexts/LocaleAvailabilityContext.tsx","app/components/DisabledActionTooltip.tsx","app/components/UnifiedContentEditor.tsx"],"functions":["LocaleAvailabilityProvider","useSingleLocaleHint","useHasMultipleLocales"],"rule":"Soll laut Regel: Sprachumschalter entfernen, alles andere deaktivieren plus Tooltip; eine leere Sprachenliste (fehlgeschlagene Abfrage) soll als mehrsprachig gelten. Ist im Code: Der Editor prüft nur shopLocales.length > 1, eine leere Liste gilt dort als einsprachig. Server-Handler bleiben trotzdem defensiv, das Gate ist nur UI.","unsure":true,"unsureNote":"Abweichung von der CLAUDE.md-Regel 'Nie auf eine fehlgeschlagene Abfrage sperren' (leere Liste = mehrsprachig): Der Editor rechnet in UnifiedContentEditor.tsx (ca. Zeile 950) hasMultipleLocales = shopLocales.length > 1. Eine leere Liste wird dort also als einsprachig behandelt, d. h. bei fehlgeschlagener Sprachen-Abfrage würden Übersetzen-Buttons ausgegraut. Die Regel wird an dieser Stelle laut Code nicht eingehalten (geprüft nur an dieser einen Stelle; ob getCachedShopLocales vorher schon einen Fehler abfängt, ist hier nicht verifiziert)."},{"id":"plantab","label":"Tab Plan","kind":"ui","col":0,"row":2,"desc":"Der Händler sieht die Pläne Free, Basic, Pro und Max, kann zwischen Varianten wählen (auch mit eingeschlossener KI) und kaufen oder kündigen. Nur der Knopf einer Karte kauft, nicht der Schalter über den Karten.","files":["app/components/SettingsPlanTab.tsx","app/routes/api.billing.create-subscription.tsx","app/routes/api.billing.cancel-subscription.tsx"],"functions":["SettingsPlanTab"],"rule":"Welcher KI-Schlüssel genutzt wird, entscheidet der Plan (verifiziertes „+ KI“-Abo = verwalteter Schlüssel, sonst eigener Schlüssel, sonst ein einmaliges Test-Guthaben, der Taster, erst nach bestätigtem Datenverarbeitungs-Hinweis), nie ein Schalter.","unsure":false,"unsureNote":""},{"id":"billing","label":"Abrechnung\n(billing.server)","kind":"server","col":1,"row":2,"desc":"Erstellt und kündigt Abos über die Shopify-Billing-API, liest das aktuelle Abo und übersetzt es in einen Plan. Prüft Testphasen-Berechtigung (nur eine Testphase pro Shop) und erkennt Partner-Entwicklungsshops.","files":["app/services/billing.server.ts","app/config/billing.ts"],"functions":["createSubscription","cancelSubscription","getCurrentSubscription","getPlanFromSubscription","isTrialEligible","detectPartnerDevelopment"],"rule":"Die Testphase wird mit einer Marke gesichert, die ein Kündigen/Neu-Abonnieren überlebt. Jeder Kauf geht über die Billing-API, nie als direkter Datenbank-Schreibzugriff. Das gilt im öffentlichen Build; im Dev-/Custom-App-Build setzt die Route den Plan direkt. Ein Abo mit KI wird nicht verkauft, wenn der verwaltete KI-Modus aus ist (Antwort 503).","unsure":false,"unsureNote":""},{"id":"shopbill","label":"Shopify Billing","kind":"shopify","col":2,"row":2,"desc":"Der Händler bestätigt oder lehnt das Abo auf Shopifys Seite ab und kommt dann zur App zurück. Änderungen am Abo meldet Shopify zusätzlich per Webhook app_subscriptions/update (in der App-Konfiguration eingetragen).","files":["shopify.app.prod.toml","app/routes/api.billing.create-subscription.tsx"],"functions":[],"rule":"","unsure":false,"unsureNote":""},{"id":"callback","label":"Rückkehr & Webhook\nAbo-Sync","kind":"server","col":3,"row":2,"desc":"Nach der Rückkehr (billing.callback) und bei jedem Abo-Webhook wird das echte Abo bei Shopify nachgelesen und in die Datenbank übernommen. checkAndSyncSubscription ist die einzige Stelle, die den Plan in AISettings schreibt. Aufgerufen wird sie bei der Installation, nach einem Kauf (?billing=success) und beim Abo-Webhook. Der Webhook antwortet bewusst immer 200.","files":["app/routes/app.billing.callback.tsx","app/routes/webhooks.subscription.tsx","app/services/billing.server.ts"],"functions":["checkAndSyncSubscription","syncSubscriptionToDatabase","resolveSubscription"],"rule":"Ein Fehler im Webhook gibt trotzdem 200 zurück, sonst schaltet Shopify nach wiederholten Fehlern den Webhook ab. Der Dev-Build hat keine Billing-API, dort überschreibt dev-plan-override den Plan.","unsure":false,"unsureNote":""},{"id":"aisettings","label":"AISettings\n(DB)","kind":"db","col":4,"row":2,"desc":"Eine Zeile pro Shop: gespeicherter Plan (subscriptionPlan), KI-Schlüssel und Anbieter, App-Sprache, KI-Anweisungen, Bild-Einstellung für die KI sowie viele weitere Schalter. Der Plan ist hier ein Spiegel des Shopify-Abos.","files":["prisma/schema.prisma"],"functions":[],"rule":"Spalten wie autoTranslateExternalChanges werden bei jedem Lesen mit dem Plan verknüpft, denn ein Downgrade setzt die Spalte nicht zurück.","unsure":false,"unsureNote":""},{"id":"gates","label":"Plan-Gates\n(Server)","kind":"server","col":4,"row":3,"desc":"meetsPlan(plan, mindestplan) vergleicht die Rangfolge der Pläne. Die Routen und KI-Handler lesen den Plan aus AISettings und antworten bei zu niedrigem Plan mit 403. Inhaltsseiten prüfen über planGateRefusal. create-gate.ts sorgt nur dafür, dass Oberfläche und Server dieselbe Antwort geben. Weitere Helfer prüfen Inhaltstypen, Mengenlimits und SEO-Funktionen.","files":["app/utils/planUtils.ts","app/config/plans.ts","app/routes/api-ai-handlers/bulk-editor-translate.handler.ts","app/routes/app.settings.tsx","app/utils/create-gate.ts","app/utils/content-route-action.server.ts"],"functions":["meetsPlan","canAccessContentType","canAccessSeoFeature","getPlanLimits","isAtLimit","planGateRefusal"],"rule":"Das Gate gehört auf den Server, weil Routen direkt per POST erreichbar sind (z. B. /api/ai, CSV-Exporte, löschen). Eine Änderung, die dem gespeicherten Wert entspricht, darf nicht fälschlich mit 403 abgewiesen werden. handleUnifiedContentActions wendet selbst kein Plan-Gate an.","unsure":true,"unsureNote":"meetsPlan wird an rund 56 Stellen genutzt; es wurden nur Beispiele geprüft (Settings, Bulk-Translate Pro, Intro-Handler Basic), nicht jede Route. Das Gate der Inhaltsseiten (content-route-action.server.ts) ist verifiziert; ein Test (content-route-actions-plan-gate-wiring.test.ts) erzwingt es für jede Inhaltsseite."},{"id":"transdb","label":"Übersetzungs-\nTabellen (DB)","kind":"db","col":2,"row":1,"desc":"Lokale Kopien der Übersetzungen: ContentTranslation, ThemeTranslation, MetaobjectTranslation und ProductImageAltTranslation. Wird eine Sprache im Shop entfernt und das ist bestätigt, löscht die App die lokalen Zeilen dieser Sprache in allen vier Tabellen; die offenen Einträge der Wiederholungsliste dieser Sprache gehen ebenfalls weg.","files":["prisma/schema.prisma","app/services/shop-locale-publish.server.ts"],"functions":["ContentTranslation","ThemeTranslation","MetaobjectTranslation","ProductImageAltTranslation"],"rule":"Gelöscht wird erst nach bestätigtem Entfernen bei Shopify; ein unbestätigtes Entfernen löscht lokal nichts. Die eigenen Daten des Händlers zur Sprache (Glossar, Direktübersetzungen, Alt-Text-Vorlagen) bleiben bewusst unberührt.","unsure":false,"unsureNote":""}],"edges":[{"from":"settings","to":"langtab","label":"Reiter"},{"from":"langtab","to":"publish","label":"Entwurf speichern"},{"from":"langtab","to":"marketaddr","label":"Aktionen"},{"from":"publish","to":"shopifylm","label":"shopLocale…"},{"from":"marketaddr","to":"shopifylm","label":"Märkte"},{"from":"shopifylm","to":"langctx","label":"Sprachenzahl","style":"dashed"},{"from":"plantab","to":"billing","label":"kaufen"},{"from":"billing","to":"shopbill","label":"Abo anlegen"},{"from":"shopbill","to":"callback","label":"Rückkehr / Webhook"},{"from":"callback","to":"aisettings","label":"Plan spiegeln"},{"from":"aisettings","to":"gates","label":"Plan lesen"},{"from":"langtab","to":"settings","label":"Aktionen","style":"dashed"},{"from":"settings","to":"plantab","label":"Reiter"},{"from":"publish","to":"transdb","label":"lokal löschen","style":"dashed"}]}];

/* layout */
function rectOf(n){return{x:n.x,y:n.y,w:BW,h:BH};}
function layout(p){

  var edges=[];(p.edges||[]).forEach(function(e,i){if(!nodes[e.from]||!nodes[e.to]||e.from===e.to)return;edges.push({i:i,from:e.from,to:e.to,label:e.label||"",style:e.style||"",s:nodes[e.from],t:nodes[e.to]});});
  var maxRow=0,minRow=0;p.nodes.forEach(function(n){maxRow=Math.max(maxRow,n.row);minRow=Math.min(minRow,n.row);});
  var sides={};
  function add(n,side,e,end,other){var k=n.id+":"+side;(sides[k]=sides[k]||[]).push({e:e,end:end,other:other,side:side,n:n});}
  edges.forEach(function(e){
    var dc=e.t.col-e.s.col,ss,ts;
    if(dc>0){ss="right";ts="left";}
    else if(dc===0){if(e.t.row>e.s.row){ss="bottom";ts="top";}else{ss="top";ts="bottom";}}
    else{if(e.t.row>=e.s.row){ss="bottom";ts="bottom";}else{ss="top";ts="top";}}
    e.ss=ss;e.ts=ts;e.dc=dc;
    add(e.s,ss,e,"s",e.t);add(e.t,ts,e,"t",e.s);
  });
  Object.keys(sides).forEach(function(k){
    var list=sides[k],side=list[0].side,n=list[0].n;
    list.forEach(function(it){it.key=(side==="left"||side==="right")?(it.other.y*1000+it.other.x):(it.other.x*1000+it.other.y);});
    list.sort(function(a,b){return a.key-b.key||a.e.i-b.e.i;});
    list.forEach(function(it,idx){
      var f=(idx+1)/(list.length+1),pt;
      if(side==="left")pt={x:n.x,y:n.y+BH*f};else if(side==="right")pt={x:n.x+BW,y:n.y+BH*f};
      else if(side==="top")pt={x:n.x+BW*f,y:n.y};else pt={x:n.x+BW*f,y:n.y+BH};
      it.e[it.end==="s"?"a":"b"]=pt;
    });
  });
  var boxes=p.nodes.map(function(n){return{id:n.id,x:n.x,y:n.y,w:BW,h:BH};});
  var lanes={},placed=[],routes=[],usedPts=[],xl={};
  function chanY(g){return OY+g*CH+BH+(CH-BH)/2;}
  function laneOff(n){return[0,8,-8,16,-16,24,-24][n%7];}
  function sample(pts){var out=[],i,a,b,len,steps,j;for(i=0;i<pts.length-1;i++){a=pts[i];b=pts[i+1];len=Math.hypot(b.x-a.x,b.y-a.y);steps=Math.max(1,Math.ceil(len/4));for(j=0;j<steps;j++)out.push({x:a.x+(b.x-a.x)*j/steps,y:a.y+(b.y-a.y)*j/steps});}out.push(pts[pts.length-1]);return out;}
  function rounded(pts){
    var d="M"+pts[0].x+" "+pts[0].y,i,r=12;
    for(i=1;i<pts.length-1;i++){
      var p0=pts[i-1],p1=pts[i],p2=pts[i+1];
      var l1=Math.hypot(p1.x-p0.x,p1.y-p0.y),l2=Math.hypot(p2.x-p1.x,p2.y-p1.y);
      if(l1<0.5||l2<0.5)continue;
      var rr=Math.min(r,l1/2,l2/2);
      var ax=p1.x-(p1.x-p0.x)/l1*rr,ay=p1.y-(p1.y-p0.y)/l1*rr,bx=p1.x+(p2.x-p1.x)/l2*rr,by=p1.y+(p2.y-p1.y)/l2*rr;
      d+=" L"+ax+" "+ay+" Q"+p1.x+" "+p1.y+" "+bx+" "+by;
    }
    var last=pts[pts.length-1];return d+" L"+last.x+" "+last.y;
  }
  function polyCand(pts,g){var c=[pts[0]];for(var i=1;i<pts.length;i++){if(Math.hypot(pts[i].x-c[c.length-1].x,pts[i].y-c[c.length-1].y)>0.5)c.push(pts[i]);}if(c.length<2)c=[pts[0],pts[pts.length-1]];return{d:rounded(c),pts:sample(c),g:g,ctrl:c};}
  function bezCand(a,b){var dx=Math.max(40,(b.x-a.x)*0.5);var c1={x:a.x+dx,y:a.y},c2={x:b.x-dx,y:b.y},pts=[],i;for(i=0;i<=60;i++){var t=i/60,u=1-t;pts.push({x:u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x,y:u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y});}
    return{bez:true,d:"M"+a.x+" "+a.y+" C"+c1.x+" "+c1.y+" "+c2.x+" "+c2.y+" "+b.x+" "+b.y,pts:pts,ctrl:[a,b]};}
  function collisions(c,e){var n=0;for(var i=0;i<c.pts.length;i++){var q=c.pts[i];for(var j=0;j<boxes.length;j++){var b=boxes[j];if(b.id===e.from||b.id===e.to)continue;if(q.x>b.x-5&&q.x<b.x+b.w+5&&q.y>b.y-5&&q.y<b.y+b.h+5){n++;break;}}}return n;}
  function cands(e){
    var a=e.a,b=e.b,out=[],g;
    if(e.dc>0){
      out.push(bezCand(a,b));
      var gapw=CW-BW,sl=(xl['s'+e.s.col]||0)%8;var smx=a.x+22+sl*(gapw-44)/7;
      if(e.dc===1&&Math.abs(a.y-b.y)>2){out.push(Object.assign(polyCand([a,{x:smx,y:a.y},{x:smx,y:b.y},b]),{step:true,sx:'s'+e.s.col}));}
      var gs=[];for(g=minRow-1;g<=maxRow;g++)gs.push(g);
      var mid=(a.y+b.y)/2;gs.sort(function(x,y){return Math.abs(chanY(x)-mid)-Math.abs(chanY(y)-mid);});
      gs.forEach(function(g){var yc=chanY(g)+laneOff(lanes[g]||0),ko=(xl["o"+e.s.col]||0)%7,ki=(xl["i"+e.t.col]||0)%7,ox=a.x+16+ko*10,ix=b.x-16-ki*10;var c=polyCand([a,{x:ox,y:a.y},{x:ox,y:yc},{x:ix,y:yc},{x:ix,y:b.y},b],g);out.push(c);});
    }else if(e.dc===0){
      var down=e.t.row>e.s.row,sg=down?1:-1;
      var jm=(a.y+b.y)/2;
      out.push(polyCand([a,{x:a.x,y:jm},{x:b.x,y:jm},b]));
      [1,-1].forEach(function(sd){var gx=sd>0?e.s.x+BW+34:e.s.x-34;gx+=sd*laneOff(lanes["c"+e.s.col]||0)/2;
        out.push(polyCand([a,{x:a.x,y:a.y+sg*14},{x:gx,y:a.y+sg*14},{x:gx,y:b.y-sg*14},{x:b.x,y:b.y-sg*14},b],"c"+e.s.col));});
    }else{
      var bottom=e.ss==="bottom",lo=Math.max(e.s.row,e.t.row),hi=Math.min(e.s.row,e.t.row);
      var gl=[];if(bottom){for(g=lo;g<=maxRow;g++)gl.push(g);}else{for(g=minRow-1;g<=hi-1;g++)gl.push(g);}
      gl.forEach(function(g){var yc=chanY(g)+laneOff(lanes[g]||0);out.push(polyCand([a,{x:a.x,y:yc},{x:b.x,y:yc},b],g));});
    }
    return out;
  }
  function wrapLabel(str){var w=str.replace(/([-\/])(?=[^\s])/g,"$1 ").split(" ");if(w.length<2)return null;var best=null,bd=1e9;for(var i=1;i<w.length;i++){var l1=w.slice(0,i).join(" "),l2=w.slice(i).join(" ");var d=Math.abs(l1.length-l2.length);if(d<bd){bd=d;best=[l1,l2];}}return best&&best.map(function(x){return x.replace(/([-\/]) /g,"$1");});}
  function labelLayouts(str){var out=[[str]];var w=wrapLabel(str);if(w)out.push(w);return out;}
  function overlapArea(r,o){var ox=Math.min(r.x+r.w,o.x+o.w)-Math.max(r.x,o.x),oy=Math.min(r.y+r.h,o.y+o.h)-Math.max(r.y,o.y);return ox>0&&oy>0?ox*oy:0;}
  function placeLabel(c,lines){
    var w=0;lines.forEach(function(l){w=Math.max(w,tw(l,LFS));});w+=12;var hh=lines.length*LLH+5;
    var ctrl=c.ctrl,segs=[],i;
    if(c.bez){segs.push({a:ctrl[0],b:ctrl[ctrl.length-1],len:1,bez:true});}
    else for(i=0;i<ctrl.length-1;i++){var len=Math.hypot(ctrl[i+1].x-ctrl[i].x,ctrl[i+1].y-ctrl[i].y);segs.push({a:ctrl[i],b:ctrl[i+1],len:len,horiz:Math.abs(ctrl[i+1].y-ctrl[i].y)<Math.abs(ctrl[i+1].x-ctrl[i].x)});}
    var spots=[];
    if(c.bez){[.5,.45,.55,.4,.6,.35,.65,.3,.7,.25,.75].forEach(function(f,k){var q=c.pts[Math.round(f*(c.pts.length-1))];spots.push({x:q.x,y:q.y,pen:k*0.5});});}
    else segs.forEach(function(sg){
      var need=(sg.horiz?w:hh)+14;if(sg.len<need)return;
      [.5,.38,.62,.28,.72].forEach(function(f,k){var x=sg.a.x+(sg.b.x-sg.a.x)*f,y=sg.a.y+(sg.b.y-sg.a.y)*f;
        spots.push({x:x,y:y,pen:(1-Math.min(sg.len,400)/400)*6+k*0.5});});
    });
    var extra=[];
    spots.forEach(function(q){extra.push({x:q.x,y:q.y-hh/2-2,pen:q.pen+2.5,off:1});extra.push({x:q.x,y:q.y+hh/2+2,pen:q.pen+2.5,off:1});});
    if(c.bez&&Math.abs(ctrl[0].y-ctrl[1].y)<3)spots=spots.concat(extra);
    else if(!c.bez)spots=spots.concat(extra.filter(function(q,i){return false;}));
    if(!spots.length)segs.slice().sort(function(p,q){return q.len-p.len;}).slice(0,2).forEach(function(sg){spots.push({x:(sg.a.x+sg.b.x)/2,y:(sg.a.y+sg.b.y)/2,pen:20});});
    var best=null;
    spots.forEach(function(q){
      var r={x:q.x-w/2,y:q.y-hh/2,w:w,h:hh},ov=0;
      boxes.forEach(function(b){ov+=overlapArea(r,{x:b.x-3,y:b.y-3,w:b.w+6,h:b.h+6});});
      placed.forEach(function(o){ov+=overlapArea(r,{x:o.x-2,y:o.y-2,w:o.w+4,h:o.h+4});});
      var hits=0;usedPts.forEach(function(u){if(u.x>r.x-1&&u.x<r.x+r.w+1&&u.y>r.y-1&&u.y<r.y+r.h+1)hits++;});

  edges.slice().sort(function(a,b){return Math.abs(a.dc)-Math.abs(b.dc)||a.i-b.i;}).forEach(function(e){
    var cs=cands(e),best=null,chosen=null,direct=Math.hypot(e.b.x-e.a.x,e.b.y-e.a.y);

      var near=0;c.pts.forEach(function(q,qi){if(qi<4||qi>c.pts.length-5)return;for(var u=0;u<usedPts.length;u++){if(Math.abs(usedPts[u].x-q.x)<4&&Math.abs(usedPts[u].y-q.y)<4){near++;break;}}});
      var base=co*1000+near*4+Math.max(0,plen-direct*(c.bez?1.15:1))/12+(c.bez?0:(c.step?2:(e.dc===1?60:2)));
      if(e.label&&e.dc===1&&Math.abs(e.a.y-e.b.y)<2&&!c.bez)base+=400;

          var pl=placeLabel(c,ly),sc=base+(pl.ov>0?14+Math.min(pl.ov,800)*0.08:0)+pl.sc*0.3+li*1.5;

    if(ch.c.g!=null){lanes[ch.c.g]=(lanes[ch.c.g]||0)+1;if(e.dc>0){xl["o"+e.s.col]=(xl["o"+e.s.col]||0)+1;xl["i"+e.t.col]=(xl["i"+e.t.col]||0)+1;}}
    ch.c.pts.forEach(function(q){usedPts.push(q);});
