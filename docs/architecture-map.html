  });
  var bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;
  function ext(x,y){bx0=Math.min(bx0,x);by0=Math.min(by0,y);bx1=Math.max(bx1,x);by1=Math.max(by1,y);}
  p.nodes.forEach(function(n){ext(n.x-6,n.y-6);ext(n.x+BW+6,n.y+BH+6);});
  routes.forEach(function(e){e.route.pts.forEach(function(q){ext(q.x,q.y);});if(e.lab){ext(e.lab.r.x,e.lab.r.y);ext(e.lab.r.x+e.lab.r.w,e.lab.r.y+e.lab.r.h);}});
  return{nodes:nodes,edges:edges,bounds:{x:bx0,y:by0,w:bx1-bx0,h:by1-by0}};
}

/* node text */
function nodeLines(label){
  var lines=String(label).split("\n").slice(0,2),inner=BW-38,fs=FS;
  if(lines.length===1&&tw(lines[0],fs,1)>inner){var w=lines[0].split(/\s+/);if(w.length>1){var best=null,bd=1e9;for(var i=1;i<w.length;i++){var l1=w.slice(0,i).join(" "),l2=w.slice(i).join(" ");var d=Math.abs(tw(l1,fs,1)-tw(l2,fs,1));if(d<bd){bd=d;best=[l1,l2];}}lines=best;}}
  while(fs>10){var mx=0;lines.forEach(function(l){mx=Math.max(mx,tw(l,fs,1));});if(mx<=inner)break;fs-=0.5;}
  return{lines:lines,fs:fs};
}

/* state */
var cur=null,L=null,sel=null,hover=null,view={k:1,tx:0,ty:0},nodeEls={},edgeEls=[],moved=false;
var byId={};DATA.forEach(function(p){byId[p.id]=p;});

function render(pid){
  var p=byId[pid];cur=p;sel=null;hover=null;
  while(world.firstChild)world.removeChild(world.firstChild);
  nodeEls={};edgeEls=[];
  $("ptitle").textContent=p.title||p.id;$("pintro").textContent=p.intro||"";
  L=layout(p);
  var gE=s("g",{},world),gN=s("g",{},world),gL=s("g",{},world);
  L.edges.forEach(function(e){
    var g=s("g",{class:"edge"+(e.style==="dashed"?" dashed":""),"data-from":e.from,"data-to":e.to},gE);
    s("path",{d:e.route.d,"marker-end":"url(#arrow)"},g);
    var lg2=null;
    if(e.lab){lg2=s("g",{class:"elabel","data-edge":e.i},gL);
      s("rect",{x:e.lab.r.x,y:e.lab.r.y,width:e.lab.r.w,height:e.lab.r.h,rx:Math.min(9,e.lab.r.h/2)},lg2);
      e.lab.lines.forEach(function(l,i){s("text",{x:e.lab.r.x+e.lab.r.w/2,y:e.lab.r.y+e.lab.r.h/2+(i-(e.lab.lines.length-1)/2)*LLH+4.4,"text-anchor":"middle",text:l},lg2);});}
    edgeEls.push({e:e,g:g,l:lg2});
  });
  p.nodes.forEach(function(n){
    var g=s("g",{class:"node k-"+n.kind,tabindex:"0",role:"button","data-id":n.id,"aria-label":flat(n.label)+" ("+(KNAME[n.kind]||n.kind)+")"},gN);
    s("rect",{class:"glow",x:n.x-4,y:n.y-4,width:BW+8,height:BH+8,rx:13},g);
    s("rect",{class:"box",x:n.x,y:n.y,width:BW,height:BH,rx:10},g);
    s("path",{class:"stripe",d:"M"+(n.x+9)+" "+(n.y+14)+"V"+(n.y+BH-14)},g);
    var nl=nodeLines(n.label),t=s("text",{"text-anchor":"middle","font-size":nl.fs,"font-weight":"600"},g);
    var cx=n.x+BW/2,cy=n.y+BH/2;
    nl.lines.forEach(function(l,i){s("tspan",{x:cx,y:cy+(i-(nl.lines.length-1)/2)*nl.fs*1.2+nl.fs*0.35,text:l},t);});
    if(n.unsure){var b=s("g",{class:"badge"},g);s("circle",{cx:n.x+BW-3,cy:n.y+3,r:9},b);s("text",{x:n.x+BW-3,y:n.y+7,"text-anchor":"middle",text:"?"},b);}
    g.addEventListener("mouseenter",function(){hover=n.id;paint();});
    g.addEventListener("mouseleave",function(){hover=null;paint();});
    g.addEventListener("click",function(ev){if(moved){ev.stopPropagation();return;}select(n.id);});
    g.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select(n.id);}});
    nodeEls[n.id]=g;
  });
  showPanel();paint();$("panel").classList.add("closed");fit();
  [].forEach.call($("plist").querySelectorAll(".pitem"),function(b){if(b.getAttribute("data-pid")===pid)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current");});
}
function paint(){
  var act=hover||sel,conn={};
  if(act){conn[act]=1;L.edges.forEach(function(e){if(e.from===act)conn[e.to]=1;if(e.to===act)conn[e.from]=1;});}
  edgeEls.forEach(function(x){var on=act&&(x.e.from===act||x.e.to===act);x.g.classList.toggle("on",!!on);x.g.classList.toggle("dim",!!act&&!on);if(x.l){x.l.classList.toggle("on",!!on);x.l.classList.toggle("dim",!!act&&!on);}});
  Object.keys(nodeEls).forEach(function(id){var g=nodeEls[id];g.classList.toggle("act",id===act);g.classList.toggle("sel",id===sel);g.classList.toggle("dim",!!act&&!conn[id]);});
}

/* view */
function applyView(){world.setAttribute("transform","translate("+view.tx+" "+view.ty+") scale("+view.k+")");}
function fit(){
  var W=canvas.clientWidth,H=canvas.clientHeight;if(!W||!H||!L)return;
  var b=L.bounds,pad=14,k=Math.min((W-2*pad)/b.w,(H-2*pad)/b.h,1.6);k=Math.max(k,0.15);
  view.k=k;view.tx=(W-b.w*k)/2-b.x*k;view.ty=(H-b.h*k)/2-b.y*k;applyView();
}
function zoomAt(f,cx,cy){var nk=Math.min(3,Math.max(0.15,view.k*f));f=nk/view.k;view.tx=cx-(cx-view.tx)*f;view.ty=cy-(cy-view.ty)*f;view.k=nk;applyView();}
svg.addEventListener("wheel",function(ev){ev.preventDefault();var r=svg.getBoundingClientRect();zoomAt(Math.exp(-ev.deltaY*(ev.deltaMode===1?0.05:0.0015)),ev.clientX-r.left,ev.clientY-r.top);},{passive:false});
var drag=null;
svg.addEventListener("pointerdown",function(ev){if(ev.button!==0)return;moved=false;drag={x:ev.clientX,y:ev.clientY,tx:view.tx,ty:view.ty,on:false};});
window.addEventListener("pointermove",function(ev){if(!drag)return;var dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(!drag.on&&Math.hypot(dx,dy)>4){drag.on=true;moved=true;svg.classList.add("panning");}if(drag.on){view.tx=drag.tx+dx;view.ty=drag.ty+dy;applyView();}});
window.addEventListener("pointerup",function(){if(drag){svg.classList.remove("panning");drag=null;setTimeout(function(){moved=false;},0);}});
window.addEventListener("pointercancel",function(){if(drag){svg.classList.remove("panning");drag=null;moved=false;}});
$("zin").addEventListener("click",function(){zoomAt(1.25,canvas.clientWidth/2,canvas.clientHeight/2);});
$("zout").addEventListener("click",function(){zoomAt(0.8,canvas.clientWidth/2,canvas.clientHeight/2);});
$("zfit").addEventListener("click",fit);
if(window.ResizeObserver){var lastW=0,lastH=0;new ResizeObserver(function(){var w=canvas.clientWidth,hh=canvas.clientHeight;if(w!==lastW||hh!==lastH){lastW=w;lastH=hh;fit();}}).observe(canvas);}else window.addEventListener("resize",fit);

function ensureVisible(id){
  var n=L.nodes[id];if(!n)return;var W=canvas.clientWidth-(window.innerWidth>760?Math.min(380,canvas.clientWidth*0.92)+10:0),H=canvas.clientHeight;
  var x0=n.x*view.k+view.tx,y0=n.y*view.k+view.ty,x1=x0+BW*view.k,y1=y0+BH*view.k;
  if(x0<0||y0<0||x1>W||y1>H){view.tx=W/2-(n.x+BW/2)*view.k;view.ty=H/2-(n.y+BH/2)*view.k;applyView();}
}

/* panel */
function copyText(txt,btn){
  function done(){var o=btn.textContent;btn.textContent="Kopiert";setTimeout(function(){btn.textContent=o;},1200);}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallback();});return;}}catch(e){}
  fallback();
  function fallback(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){}document.body.removeChild(ta);}
}
function showPanel(){
  var body=$("pbody");body.textContent="";
  if(!sel){body.appendChild(h("div",{class:"hint"},[h("p",{text:"Klicke auf einen Knoten, um Beschreibung, Dateien, zentrale Funktionen und die zugehörige Regel aus CLAUDE.md zu sehen."}),h("p",{class:"dashnote",text:"Gestrichelte Pfeile = optional, bedingt oder asynchron. Ein gelbes „?“ am Knoten markiert Angaben, die nicht vollständig geprüft sind. Mausrad = Zoom, Ziehen = Verschieben."})]));return;}
  var n=L.nodes[sel];
  body.appendChild(h("span",{class:"chip k-"+n.kind},[h("i"),KNAME[n.kind]||n.kind]));
  body.appendChild(h("h3",{id:"panel-title",text:flat(n.label)}));
  if(n.desc)body.appendChild(h("p",{text:n.desc,style:"margin:6px 0"}));
  if(n.unsure)body.appendChild(h("div",{class:"warn"},[h("strong",{text:"Unsicher: "}),n.unsureNote||"Diese Angabe ist nicht vollständig verifiziert."]));
  if(n.files&&n.files.length){body.appendChild(h("h4",{text:"Dateien"}));n.files.forEach(function(f){var b=h("button",{class:"cp",type:"button",text:"Kopieren","aria-label":"Pfad kopieren: "+f});b.addEventListener("click",function(){copyText(f,b);});body.appendChild(h("div",{class:"frow"},[h("code",{class:"mono",text:f}),b]));});}
  if(n.functions&&n.functions.length){body.appendChild(h("h4",{text:"Zentrale Funktionen"}));n.functions.forEach(function(f){body.appendChild(h("code",{class:"fn mono",text:f}));});}
  if(n.rule&&String(n.rule).trim()){body.appendChild(h("h4",{text:"Regel aus CLAUDE.md"}));body.appendChild(h("div",{class:"rule",text:n.rule}));}
  var ins=[],outs=[];L.edges.forEach(function(e){if(e.to===sel)ins.push(e);if(e.from===sel)outs.push(e);});
  if(ins.length||outs.length){
    body.appendChild(h("h4",{text:"Verbindungen"}));
    function item(e,out){var o=out?e.t:e.s;var b=h("button",{class:"conn",type:"button"},[h("span",{class:"arr",text:out?"→":"←"}),h("span",{},[flat(o.label),e.label?h("small",{text:e.label+(e.style==="dashed"?" (optional/async)":"")}):(e.style==="dashed"?h("small",{text:"(optional/async)"}):null)])]);b.addEventListener("click",function(){select(o.id);});return b;}
    outs.forEach(function(e){body.appendChild(item(e,true));});
    ins.forEach(function(e){body.appendChild(item(e,false));});
  }
  body.scrollTop=0;
}
function select(id){sel=id;showPanel();paint();ensureVisible(id);openPanel();}
function openPanel(){$("panel").classList.remove("closed");}
function closePanel(){sel=null;showPanel();paint();$("panel").classList.add("closed");}
$("pclose").addEventListener("click",closePanel);
$("itoggle").addEventListener("click",function(){var c=$("intro").classList.toggle("col");$("itoggle").textContent=c?"Einleitung einblenden":"Einleitung ausblenden";});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"){if(document.activeElement===$("search")&&$("search").value){$("search").value="";buildList();return;}if(sel){sel=null;showPanel();paint();}else if(!$("panel").classList.contains("closed"))closePanel();}});

/* sidebar */
function go(pid,nid){
  if(location.hash!=="#"+pid){try{history.replaceState(null,"","#"+pid);}catch(e){location.hash=pid;}}
  render(pid);if(nid)select(nid);
}
function pnum(p,i){var m=/^p(\d+)$/.exec(p.id);return m?parseInt(m[1],10):i+1;}
function buildList(){
  var box=$("plist"),q=$("search").value.trim().toLowerCase();box.textContent="";
  if(!q){DATA.forEach(function(p,i){var b=h("button",{class:"pitem",type:"button","data-pid":p.id},[h("span",{class:"num",text:String(pnum(p,i))}),h("span",{},[p.title||p.id])]);if(cur&&cur.id===p.id)b.setAttribute("aria-current","true");b.addEventListener("click",function(){go(p.id);});box.appendChild(b);});return;}
  var res=[];
  DATA.forEach(function(p,pi){(p.nodes||[]).forEach(function(n){
    var hay=[n.label,n.id].concat(n.files||[],n.functions||[]).join(" ").toLowerCase(),score=0;
    if(flat(n.label).toLowerCase().indexOf(q)>=0)score=3;else if(hay.indexOf(q)>=0)score=2;else if((n.desc||"").toLowerCase().indexOf(q)>=0)score=1;
    if(score)res.push({p:p,pi:pi,n:n,score:score});});});
  res.sort(function(a,b){return b.score-a.score||a.pi-b.pi;});
  box.appendChild(h("div",{class:"shead",text:res.length?res.length+" Treffer"+(res.length>40?" (erste 40)":""):"Keine Treffer"}));
  res.slice(0,40).forEach(function(r){
    var hit=[].concat(r.n.files||[],r.n.functions||[]).filter(function(x){return x.toLowerCase().indexOf(q)>=0;})[0];
    var b=h("button",{class:"pitem",type:"button"},[h("span",{class:"num",text:"P"+pnum(r.p,r.pi)}),h("span",{},[flat(r.n.label),h("span",{class:"sn",text:hit||r.p.title})])]);
    b.addEventListener("click",function(){go(r.p.id,r.n.id);});box.appendChild(b);});
}
$("search").addEventListener("input",buildList);

function fromHash(){var id=location.hash.replace("#","");return byId[id]?id:DATA[0].id;}
window.addEventListener("hashchange",function(){var id=fromHash();if(!cur||cur.id!==id)render(id);});
buildList();
if(DATA.length)render(fromHash());
})();
</script>
</body>
