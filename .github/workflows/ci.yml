name: CI

# Gates every push and PR to the long-lived branches. Before this workflow
# existed, `npm test` (vitest) was wired into NO build/container/deploy path
# (the Dockerfile only runs build + start), so the security tests —
# including the GDPR schema-drift guard in tests/unit/gdpr.service.test.ts
# that would have caught a cross-tenant data-retention leak — never ran and
# could not block a release (review R3-C2).
on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]

# A newer push to the same ref cancels the in-progress run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Container build uses --ignore-scripts, so the Prisma client is NOT
      # generated by `npm ci` there; generate it explicitly so tsc and vitest
      # have @prisma/client types/runtime. No database is required for
      # `prisma generate` (schema-only).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # Mirrors the Railway production build (prisma generate + remix vite:build
      # + strip-client-sourcemaps). Catches client-bundle esbuild errors that
      # tsc/vitest miss — e.g. the bad merge that left `sentryActive`/`ENV`
      # declared twice in app/root.tsx and broke the prod deploy.
      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test
