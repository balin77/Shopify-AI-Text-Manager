name = "ContentPilot AI"
client_id = "9e5abc8c0e9e03ed24d4a2a2b1174c88"
application_url = "https://contentpilotai.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_legal_policies,write_legal_policies,read_locales,read_online_store_navigation,read_online_store_pages,write_online_store_pages,read_product_listings,read_products,write_products,read_content,write_content,read_themes,write_themes,read_translations,write_translations,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions"

[auth]
redirect_urls = [
  "https://contentpilotai.up.railway.app/auth/callback",
  "https://contentpilotai.up.railway.app/auth/shopify/callback",
  "https://contentpilotai.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "/webhooks/compliance"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "8c19f3-ce.myshopify.com"
