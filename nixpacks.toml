# Node 22 to match the Dockerfile (node:22-alpine) and package.json engines —
# previously Node 20 here vs 22 in Docker was a runtime drift between the two
# possible build paths.
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start:production"
