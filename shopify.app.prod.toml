# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "ContentPilot AI"
client_id = "9e5abc8c0e9e03ed24d4a2a2b1174c88"
application_url = "https://contentpilotai.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_legal_policies,write_legal_policies,read_locales,read_online_store_navigation,read_online_store_pages,write_online_store_pages,read_product_listings,read_products,write_products,read_content,write_content,read_themes,write_themes,read_translations,write_translations,write_metaobjects,read_metaobject_definitions,read_markets"

[app_proxy]
# Storefront /apps/contentpilot/* → forwarded to {url}/* (here: /proxy/*).
# Serves the dynamic-translation dictionary to the theme app embed.
url = "https://contentpilotai.up.railway.app/proxy"
prefix = "apps"
subpath = "contentpilot"

[auth]
redirect_urls = [
  "https://contentpilotai.up.railway.app/auth/callback",
  "https://contentpilotai.up.railway.app/auth/shopify/callback",
  "https://contentpilotai.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "/webhooks/compliance"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app-uninstalled"

[[webhooks.subscriptions]]
topics = [ "products/create", "products/update", "products/delete" ]
uri = "/webhooks/products"

[[webhooks.subscriptions]]
topics = [ "collections/create", "collections/update", "collections/delete" ]
uri = "/webhooks/collections"

[[webhooks.subscriptions]]
topics = [ "app_subscriptions/update" ]
uri = "/webhooks/subscription"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "patis-universe-test-shop.myshopify.com"
