name = "ContentPilot AI Dev"
client_id = "433cf493223c0c6b95bdb91b0de5961a"
application_url = "https://shopify-ai-text-manager-development.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_files,write_files,read_legal_policies,write_legal_policies,read_locales,read_markets,read_metaobject_definitions,write_metaobject_definitions,write_metaobjects,read_online_store_navigation,write_online_store_navigation,read_online_store_pages,write_online_store_pages,read_product_listings,read_products,write_products,read_content,write_content,read_themes,write_themes,read_translations,write_translations,write_inventory,read_locations,write_publications"

[app_proxy]
# Storefront /apps/contentpilot/* → forwarded to {url}/* (here: /proxy/*).
# Serves the dynamic-translation dictionary to the theme app embed.
url = "https://shopify-ai-text-manager-development.up.railway.app/proxy"
prefix = "apps"
subpath = "contentpilot"

[auth]
redirect_urls = [
  "https://shopify-ai-text-manager-development.up.railway.app/auth/callback",
  "https://shopify-ai-text-manager-development.up.railway.app/auth/shopify/callback",
  "https://shopify-ai-text-manager-development.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "/webhooks/compliance"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app-uninstalled"

[[webhooks.subscriptions]]
topics = [ "products/create", "products/update", "products/delete" ]
uri = "/webhooks/products"

[[webhooks.subscriptions]]
topics = [ "collections/create", "collections/update", "collections/delete" ]
uri = "/webhooks/collections"

[[webhooks.subscriptions]]
topics = [ "app_subscriptions/update" ]
uri = "/webhooks/subscription"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "8c19f3-ce.myshopify.com"
